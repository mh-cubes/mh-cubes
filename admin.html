<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - MH CUBES</title>

<link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

<header>

<div class="logo">
MH CUBES ADMIN
</div>

<nav>

<a href="index.html">
Home
</a>

</nav>

</header>

<div class="orders">

<button class="logout-btn" id="logout-button">
🚪 Logout
</button>

<h1>
Customer Orders 📦
</h1>

<div id="admin-order-box" class="admin-order-box">
🔄 Checking owner access...
</div>

</div>

<script type="module">

import { auth } from "./assets/js/firebase.js";

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


const orderBox =
    document.getElementById("admin-order-box");


onAuthStateChanged(auth, function(user) {

    if (!user) {

        window.location.href =
            "owner-login.html";

        return;

    }

    orderBox.innerHTML =
        "🔄 Loading orders...";

});


document
    .getElementById("logout-button")
    .addEventListener("click", async function() {

        try {

            await signOut(auth);

            localStorage.removeItem("adminAccess");

            window.location.href =
                "owner-login.html";

        } catch (error) {

            console.error(
                "Logout error:",
                error
            );

            alert(
                "❌ Logout failed. Please try again."
            );

        }

    });

</script>

<script type="module" src="assets/js/admin.js"></script>

</body>

</html>
