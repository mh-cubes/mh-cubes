<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>My Account - MH CUBES</title>

<link
    rel="stylesheet"
    href="assets/css/style.css"
>

<style>

/* =========================================
   ACCOUNT PAGE
========================================= */

body {
    min-height: 100vh;
}


/* =========================================
   ACCOUNT NAVIGATION
========================================= */

.account-nav {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 16px;

    flex-wrap: wrap;

    padding: 22px 20px;

    margin-top: 10px;

}


.account-nav a {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    min-width: 150px;

    padding: 13px 24px;

    border-radius: 14px;

    text-decoration: none;

    color: white;

    font-size: 15px;

    font-weight: 800;

    background:
        linear-gradient(
            135deg,
            #dc2626,
            #991b1b
        );

    border: 1px solid
        rgba(255,255,255,0.12);

    box-shadow:
        0 8px 22px
        rgba(0,0,0,0.25);

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;

}


.account-nav a:hover {

    transform: translateY(-3px);

    background:
        linear-gradient(
            135deg,
            #ef4444,
            #b91c1c
        );

    box-shadow:
        0 12px 28px
        rgba(220,38,38,0.35);

}


/* =========================================
   ACCOUNT CONTAINER
========================================= */

.account-container {

    max-width: 1000px;

    margin: 35px auto 60px;

    padding: 20px;

}


/* =========================================
   ACCOUNT HEADER
========================================= */

.account-header {

    background:
        linear-gradient(
            135deg,
            #111827,
            #2563eb
        );

    color: white;

    padding: 40px 30px;

    border-radius: 25px;

    text-align: center;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,0.2);

}


.account-avatar {

    width: 90px;

    height: 90px;

    margin: 0 auto 15px;

    border-radius: 50%;

    background: white;

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 45px;

}


.account-header h1 {

    margin: 10px 0;

    font-size: 32px;

}


.account-header p {

    margin: 5px 0;

    opacity: 0.9;

}


/* =========================================
   EMAIL
========================================= */

.account-email {

    display: inline-block;

    margin-top: 15px;

    padding: 10px 18px;

    background:
        rgba(255,255,255,0.15);

    border-radius: 30px;

    font-size: 15px;

}


/* =========================================
   ACCOUNT CARDS
========================================= */

.account-actions {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 20px;

    margin-top: 25px;

}


.account-card {

    background: white;

    padding: 30px;

    border-radius: 20px;

    text-align: center;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,0.12);

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;

}


.account-card:hover {

    transform: translateY(-5px);

    box-shadow:
        0 15px 35px
        rgba(0,0,0,0.18);

}


.account-icon {

    font-size: 40px;

    margin-bottom: 10px;

}


.account-card h3 {

    margin: 8px 0;

}


.account-card p {

    color: #666;

    font-size: 14px;

    margin-bottom: 20px;

}


/* =========================================
   TOTAL ORDERS
========================================= */

.order-count {

    font-size: 42px;

    font-weight: bold;

    color: #2563eb;

    margin: 10px 0;

}


.order-count-text {

    color: #666;

    font-size: 14px;

    margin-bottom: 20px;

}


/* =========================================
   BUTTONS
========================================= */

.account-button {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    width: 100%;

    padding: 13px;

    border: none;

    border-radius: 10px;

    background: #2563eb;

    color: white;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;

    text-decoration: none;

    box-sizing: border-box;

    transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;

}


.account-button:hover {

    background: #1d4ed8;

    transform: translateY(-2px);

    box-shadow:
        0 7px 18px
        rgba(37,99,235,0.25);

}


/* =========================================
   SHOP BUTTON
========================================= */

.shop-button {

    display: flex;

    width: min(420px, 100%);

    margin: 30px auto 0;

    background: white;

    color: #2563eb;

    border: 2px solid #2563eb;

}


.shop-button:hover {

    background: #2563eb;

    color: white;

}


/* =========================================
   LOGOUT BUTTON
========================================= */

.logout-button {

    display: flex;

    width: min(420px, 100%);

    margin: 15px auto 0;

    background: #dc2626;

}


.logout-button:hover {

    background: #b91c1c;

}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 700px) {

    .account-nav {

        gap: 10px;

        padding: 18px 15px;

    }


    .account-nav a {

        min-width: 135px;

        padding: 12px 18px;

        font-size: 14px;

    }


    .account-container {

        margin: 20px auto 40px;

        padding: 15px;

    }


    .account-header {

        padding: 30px 20px;

    }


    .account-header h1 {

        font-size: 26px;

    }


    .account-actions {

        grid-template-columns: 1fr;

    }


    .account-card {

        padding: 25px;

    }

}
/* =========================================
   ACCOUNT PAGE BACKGROUND
========================================= */

body {
    background:
        radial-gradient(
            circle at top left,
            rgba(220, 38, 38, 0.12),
            transparent 35%
        ),
        radial-gradient(
            circle at bottom right,
            rgba(153, 27, 27, 0.10),
            transparent 35%
        ),
        #f5f5f5;
}
</style>

</head>


<body>


<!-- =========================================
     ACCOUNT NAVIGATION
========================================= -->

<nav class="account-nav">

    <a href="index.html">
        🏠 Home
    </a>

    <a href="my-orders.html">
        📦 My Orders
    </a>

</nav>


<!-- =========================================
     ACCOUNT
========================================= -->

<main>

<div class="account-container">


<!-- =========================================
     ACCOUNT HEADER
========================================= -->

<div class="account-header">

    <div class="account-avatar">
        👤
    </div>

    <h1>
        My Account
    </h1>

    <p>
        Welcome back to MH CUBES!
    </p>

    <div
        class="account-email"
        id="account-email"
    >
        Loading...
    </div>

</div>


<!-- =========================================
     ACCOUNT ACTIONS
========================================= -->

<div class="account-actions">


<!-- MY ORDERS -->

<div class="account-card">

    <div class="account-icon">
        📦
    </div>

    <h3>
        My Orders
    </h3>

    <p>
        View your previous and current orders.
    </p>

    <a
        href="my-orders.html"
        class="account-button"
    >
        View My Orders
    </a>

</div>


<!-- TRACK ORDER -->

<div class="account-card">

    <div class="account-icon">
        🔍
    </div>

    <h3>
        Track Order
    </h3>

    <p>
        Check the current status of your order.
    </p>

    <a
        href="track-order.html"
        class="account-button"
    >
        Track My Order
    </a>

</div>


<!-- TOTAL ORDERS -->

<div class="account-card">

    <div class="account-icon">
        📊
    </div>

    <h3>
        Total Orders
    </h3>

    <div
        class="order-count"
        id="order-count"
    >
        ...
    </div>

    <div class="order-count-text">
        Orders you've placed with MH CUBES
    </div>

</div>


</div>


<!-- =========================================
     CONTINUE SHOPPING
========================================= -->

<a
    href="index.html"
    class="account-button shop-button"
>
    🛍️ Continue Shopping
</a>


<!-- =========================================
     LOGOUT
========================================= -->

<button
    class="account-button logout-button"
    id="logout-button"
    type="button"
>
    🚪 Logout
</button>


</div>

</main>


<!-- =========================================
     FIREBASE
========================================= -->

<script type="module">

import { auth, db } from "./assets/js/firebase.js";

import {

    onAuthStateChanged,

    signOut

} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {

    collection,

    query,

    where,

    getDocs

} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const emailBox =
    document.getElementById(
        "account-email"
    );


const orderCount =
    document.getElementById(
        "order-count"
    );


const logoutButton =
    document.getElementById(
        "logout-button"
    );


// =========================================
// CHECK LOGIN
// =========================================

onAuthStateChanged(

    auth,

    async function(user) {

        if (!user) {

            window.location.replace(
                "customer-login.html"
            );

            return;

        }


        // CUSTOMER EMAIL

        emailBox.innerText =
            user.email ||
            "Customer account";


        // LOAD TOTAL ORDERS

        try {

            const ordersRef =
                collection(
                    db,
                    "orders"
                );


            const ordersQuery =
                query(

                    ordersRef,

                    where(
                        "customerUID",
                        "==",
                        user.uid
                    )

                );


            const snapshot =
                await getDocs(
                    ordersQuery
                );


            orderCount.innerText =
                snapshot.size;

        }

        catch (error) {

            console.error(
                "Order count error:",
                error
            );

            orderCount.innerText =
                "0";

        }

    }

);


// =========================================
// LOGOUT
// =========================================

logoutButton.addEventListener(

    "click",

    async function() {

        try {

            await signOut(auth);

            window.location.replace(
                "index.html"
            );

        }

        catch (error) {

            console.error(
                "Logout error:",
                error
            );

            alert(
                "❌ Failed to logout. Please try again."
            );

        }

    }

);

</script>


</body>

</html>
