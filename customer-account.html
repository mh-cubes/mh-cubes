```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>My Account - MH CUBES</title>

<link
    rel="stylesheet"
    href="assets/css/style.css"
>

<style>

.account-box{
    max-width:500px;
    margin:80px auto;
    padding:35px;
    background:#fff;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

.account-box h1{
    margin-bottom:10px;
}

.account-email{
    margin:20px 0;
    font-size:18px;
}

.account-button{
    display:block;
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.logout-button{
    background:#dc2626;
}

.account-button:hover{
    opacity:0.9;
}


/* ============================= */
/* LOGOUT LOADING SCREEN */
/* ============================= */

#logout-loading{

    position:fixed;
    inset:0;

    background:rgba(0,0,0,0.85);

    display:none;

    justify-content:center;
    align-items:center;

    flex-direction:column;

    z-index:9999;

    color:white;

}

.loader{

    width:60px;
    height:60px;

    border:6px solid #444;

    border-top:6px solid #2563eb;

    border-radius:50%;

    animation:spin 1s linear infinite;

    margin-bottom:20px;

}

@keyframes spin{

    100%{
        transform:rotate(360deg);
    }

}


/* ============================= */
/* SUCCESS POPUP */
/* ============================= */

#logout-popup{

    position:fixed;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    background:white;

    padding:30px;

    width:300px;

    border-radius:15px;

    text-align:center;

    box-shadow:0 10px 40px rgba(0,0,0,0.4);

    display:none;

    z-index:10000;

}

#logout-popup h2{

    color:#16a34a;

    margin-bottom:10px;

}

</style>

</head>

<body>


<header>

<div class="logo">
MH CUBES
</div>

<nav>

<a href="index.html">
🏠 Home
</a>

<a href="orders.html">
📦 My Orders
</a>

</nav>

</header>


<main>

<div class="account-box">

<div style="font-size:55px;">
👤
</div>

<h1>
My Account
</h1>

<p>
You are currently logged in.
</p>

<div
    class="account-email"
    id="account-email"
>
Loading...
</div>

<button
    class="account-button"
    onclick="window.location.href='orders.html'"
>
📦 View My Orders
</button>

<button
    class="account-button logout-button"
    id="logout-button"
>
🚪 Logout
</button>

</div>

</main>


<!-- LOGOUT LOADING -->

<div id="logout-loading">

    <div class="loader"></div>

    <h2>
        Logging out...
    </h2>

    <p>
        Please wait...
    </p>

</div>


<!-- LOGOUT SUCCESS POPUP -->

<div id="logout-popup">

    <h2>
        ✅ Logged Out
    </h2>

    <p>
        You have been logged out successfully!
    </p>

</div>


<script type="module">

import { auth } from "./assets/js/firebase.js";

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


const emailBox =
    document.getElementById("account-email");

const logoutButton =
    document.getElementById("logout-button");

const loadingScreen =
    document.getElementById("logout-loading");

const logoutPopup =
    document.getElementById("logout-popup");


// =============================
// CHECK LOGIN
// =============================

onAuthStateChanged(
    auth,
    function(user){

        if(!user){

            window.location.href =
                "customer-login.html";

            return;

        }

        emailBox.innerText =
            user.email ||
            "Customer account";

    }
);


// =============================
// LOGOUT
// =============================

logoutButton.addEventListener(
    "click",
    async function(){

        // Show loading screen

        loadingScreen.style.display =
            "flex";


        try{

            // Firebase logout

            await signOut(auth);


            // Wait 5 seconds

            setTimeout(
                function(){

                    // Hide loading

                    loadingScreen.style.display =
                        "none";


                    // Show popup

                    logoutPopup.style.display =
                        "block";


                    // Redirect after popup

                    setTimeout(
                        function(){

                            window.location.href =
                                "customer-login.html";

                        },
                        1500
                    );

                },
                5000
            );


        }catch(error){

            console.error(
                "Logout error:",
                error
            );


            loadingScreen.style.display =
                "none";


            alert(
                "❌ Failed to logout. Please try again."
            );

        }

    }
);

</script>


</body>

</html>
