<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>My Account - MH CUBES</title>

<link
    rel="stylesheet"
    href="assets/css/style.css"
>

<style>

/* ============================= */
/* ACCOUNT PAGE */
/* ============================= */

body{
    min-height:100vh;
}


/* ============================= */
/* ACCOUNT CONTAINER */
/* ============================= */

.account-container{

    max-width:900px;

    margin:60px auto;

    padding:20px;

}


/* ============================= */
/* ACCOUNT HEADER */
/* ============================= */

.account-header{

    background:linear-gradient(
        135deg,
        #111827,
        #2563eb
    );

    color:white;

    padding:40px 30px;

    border-radius:25px;

    text-align:center;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,0.2);

}


.account-avatar{

    width:90px;
    height:90px;

    margin:0 auto 15px;

    border-radius:50%;

    background:white;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:45px;

}


.account-header h1{

    margin:10px 0;

    font-size:32px;

}


.account-header p{

    margin:5px 0;

    opacity:0.9;

}


/* ============================= */
/* EMAIL */
/* ============================= */

.account-email{

    display:inline-block;

    margin-top:15px;

    padding:10px 18px;

    background:rgba(255,255,255,0.15);

    border-radius:30px;

    font-size:15px;

}


/* ============================= */
/* ACCOUNT CARDS */
/* ============================= */

.account-actions{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:20px;

    margin-top:25px;

}


.account-card{

    background:white;

    padding:30px;

    border-radius:20px;

    text-align:center;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,0.12);

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;

}


.account-card:hover{

    transform:translateY(-5px);

    box-shadow:
        0 15px 35px
        rgba(0,0,0,0.18);

}


.account-icon{

    font-size:40px;

    margin-bottom:10px;

}


.account-card h3{

    margin:8px 0;

}


.account-card p{

    color:#666;

    font-size:14px;

    margin-bottom:20px;

}


/* ============================= */
/* BUTTONS */
/* ============================= */

.account-button{

    display:inline-block;

    width:100%;

    padding:13px;

    border:none;

    border-radius:10px;

    background:#2563eb;

    color:white;

    font-size:15px;

    cursor:pointer;

    text-decoration:none;

    box-sizing:border-box;

    transition:
        background 0.2s ease;

}


.account-button:hover{

    background:#1d4ed8;

}


.logout-button{

    background:#dc2626;

}


.logout-button:hover{

    background:#b91c1c;

}


/* ============================= */
/* SHOP BUTTON */
/* ============================= */

.shop-button{

    margin-top:25px;

    background:white;

    color:#2563eb;

    border:2px solid #2563eb;

}


.shop-button:hover{

    background:#2563eb;

    color:white;

}


/* ============================= */
/* LOGOUT LOADING */
/* ============================= */

#logout-loading{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,0.85);

    display:none;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    z-index:9999;

    color:white;

}


.loader{

    width:60px;

    height:60px;

    border:6px solid #444;

    border-top:6px solid #2563eb;

    border-radius:50%;

    animation:spin 1s linear infinite;

    margin-bottom:20px;

}


@keyframes spin{

    100%{

        transform:rotate(360deg);

    }

}


/* ============================= */
/* MOBILE */
/* ============================= */

@media(max-width:600px){

    .account-container{

        margin:30px auto;

        padding:15px;

    }


    .account-header{

        padding:30px 20px;

    }


    .account-header h1{

        font-size:26px;

    }


    .account-actions{

        grid-template-columns:1fr;

    }


    .account-card{

        padding:25px;

    }

}

</style>

</head>


<body>


<!-- ============================= -->
<!-- HEADER -->
<!-- ============================= -->

<header>

<div class="logo">
MH CUBES
</div>


<nav>

<a href="index.html">
🏠 Home
</a>


<a href="my-orders.html">
📦 My Orders
</a>

</nav>

</header>



<!-- ============================= -->
<!-- ACCOUNT -->
<!-- ============================= -->

<main>

<div class="account-container">


<!-- ACCOUNT HEADER -->

<div class="account-header">


<div class="account-avatar">
👤
</div>


<h1>
My Account
</h1>


<p>
Welcome back to MH CUBES!
</p>


<div
    class="account-email"
    id="account-email"
>
Loading...
</div>


</div>



<!-- ACCOUNT ACTIONS -->

<div class="account-actions">


<!-- MY ORDERS -->

<div class="account-card">

<div class="account-icon">
📦
</div>


<h3>
My Orders
</h3>


<p>
View your previous and current orders.
</p>


<a
    href="my-orders.html"
    class="account-button"
>
View My Orders
</a>

</div>



<!-- TRACK ORDER -->

<div class="account-card">

<div class="account-icon">
🔍
</div>


<h3>
Track Order
</h3>


<p>
Check the current status of your order.
</p>


<a
    href="track-order.html"
    class="account-button"
>
Track My Order
</a>

</div>

</div>



<!-- CONTINUE SHOPPING -->

<a
    href="index.html"
    class="account-button shop-button"
>
🛍️ Continue Shopping
</a>



<!-- LOGOUT -->

<button
    class="account-button logout-button"
    id="logout-button"
>
🚪 Logout
</button>


</div>

</main>



<!-- ============================= -->
<!-- LOGOUT LOADING -->
<!-- ============================= -->

<div id="logout-loading">

<div class="loader"></div>


<h2>
Logging out...
</h2>


<p>
Please wait...
</p>

</div>



<!-- ============================= -->
<!-- FIREBASE -->
<!-- ============================= -->

<script type="module">

import { auth } from "./assets/js/firebase.js";

import {

    onAuthStateChanged,

    signOut

} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";



const emailBox =
    document.getElementById(
        "account-email"
    );


const logoutButton =
    document.getElementById(
        "logout-button"
    );


const loadingScreen =
    document.getElementById(
        "logout-loading"
    );



// =============================
// CHECK LOGIN
// =============================

onAuthStateChanged(

    auth,

    function(user){

        if(!user){

            window.location.replace(
                "customer-login.html"
            );

            return;

        }


        emailBox.innerText =
            user.email ||
            "Customer account";

    }

);



// =============================
// LOGOUT
// =============================

logoutButton.addEventListener(

    "click",

    async function(){

        try{

            loadingScreen.style.display =
                "flex";


            await signOut(auth);


            window.location.replace(
                "/index.html"
            );


        }

        catch(error){

            console.error(
                "Logout error:",
                error
            );


            loadingScreen.style.display =
                "none";


            alert(
                "❌ Failed to logout. Please try again."
            );

        }

    }

);

</script>


</body>

</html>
