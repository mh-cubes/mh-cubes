
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cart - MH CUBES</title>

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >

    <style>

/* =========================================================
   MH CUBES — CART PAGE
========================================================= */

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(
            circle at top,
            rgba(220, 38, 38, 0.12),
            transparent 35%
        ),
        #050505 !important;

    color: white;
}


/* =========================================================
   HEADER
========================================================= */

.cart-header {
    width: 100%;

    background: #050505;

    border-bottom: 1px solid rgba(255, 255, 255, 0.08);

    padding: 18px 30px;

    box-sizing: border-box;

    display: flex;
    align-items: center;
    justify-content: space-between;

    position: relative;
    z-index: 10;
}

.cart-header .logo {
    font-size: 24px;
    font-weight: 900;

    color: #ffffff;

    letter-spacing: 1px;
}

.cart-header nav {
    display: flex;
    align-items: center;
    gap: 12px;
}

.cart-header nav a {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    padding: 10px 18px;

    background: #111111;

    color: #ffffff;

    border: 1px solid rgba(255, 255, 255, 0.12);

    border-radius: 10px;

    text-decoration: none;

    font-weight: 800;

    transition: 0.2s ease;
}

.cart-header nav a:hover {
    background: #1a1a1a;

    border-color: #00ffff;

    color: #00ffff;

    transform: translateY(-2px);
}


/* =========================================================
   CART PAGE
========================================================= */

.cart-page {
    width: 100%;

    max-width: 1150px;

    margin: 0 auto;

    padding: 55px 20px 80px;

    box-sizing: border-box;
}


/* =========================================================
   TITLE
========================================================= */

.cart-title {
    text-align: center;

    margin-bottom: 45px;
}

.cart-title h1 {
    margin: 0;

    font-size: 46px;

    font-weight: 900;

    color: #ffffff;

    text-shadow:
        0 0 15px rgba(255, 255, 255, 0.12);
}

.cart-title p {
    margin: 12px 0 0;

    color: #aaa;

    font-size: 16px;
}


/* =========================================================
   CART LAYOUT
========================================================= */

.cart-layout {
    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        340px;

    gap: 28px;

    align-items: start;
}


/* =========================================================
   CART ITEMS BOX
========================================================= */

#cart-items {
    min-height: 220px;

    padding: 25px;

    box-sizing: border-box;

    background:
        linear-gradient(
            145deg,
            #101010,
            #070707
        );

    border: 1px solid rgba(255, 255, 255, 0.09);

    border-radius: 20px;

    box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.35);
}


/* =========================================================
   SUMMARY
========================================================= */

.summary {
    padding: 26px;

    box-sizing: border-box;

    background:
        linear-gradient(
            145deg,
            #151515,
            #080808
        );

    border: 1px solid rgba(0, 255, 255, 0.2);

    border-radius: 20px;

    box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.4),
        0 0 25px rgba(0, 255, 255, 0.04);

    position: sticky;

    top: 25px;
}

.summary h2 {
    margin: 0 0 22px;

    color: #00ffff;

    font-size: 24px;

    font-weight: 900;
}

#summary-total {
    margin: 0 0 25px;

    padding: 17px;

    background: #00ffff;

    color: #050505;

    border-radius: 12px;

    font-size: 20px;

    font-weight: 900;

    text-align: center;
}


/* =========================================================
   CHECKOUT BUTTON
========================================================= */

.summary a {
    display: block;

    text-decoration: none;
}

.summary button {
    width: 100%;

    border: none;

    padding: 15px 18px;

    background:
        linear-gradient(
            135deg,
            #dc2626,
            #ef4444
        );

    color: #ffffff;

    border-radius: 12px;

    font-size: 16px;

    font-weight: 900;

    cursor: pointer;

    box-shadow:
        0 8px 20px rgba(220, 38, 38, 0.25);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}

.summary button:hover {
    transform: translateY(-3px);

    box-shadow:
        0 12px 28px rgba(220, 38, 38, 0.4);
}


/* =========================================================
   CART PRODUCT OVERRIDES
========================================================= */

#cart-items > div {
    background:
        linear-gradient(
            145deg,
            #151515,
            #0b0b0b
        ) !important;

    border: 1px solid rgba(0, 255, 255, 0.12) !important;

    border-radius: 16px !important;

    color: #ffffff !important;

    margin-bottom: 15px;

    box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.25);
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 800px) {

    .cart-header {
        padding: 15px 16px;
    }

    .cart-header .logo {
        font-size: 20px;
    }

    .cart-header nav a {
        padding: 9px 13px;

        font-size: 13px;
    }

    .cart-page {
        padding: 35px 12px 55px;
    }

    .cart-title {
        margin-bottom: 28px;
    }

    .cart-title h1 {
        font-size: 34px;
    }

    .cart-title p {
        font-size: 14px;
    }

    .cart-layout {
        grid-template-columns: 1fr;

        gap: 18px;
    }

    .summary {
        position: static;

        padding: 20px;
    }

    #cart-items {
        padding: 15px;
    }

}


/* =========================================================
   SMALL PHONES
========================================================= */

@media (max-width: 450px) {

    .cart-header .logo {
        font-size: 18px;
    }

    .cart-header nav a {
        padding: 8px 11px;

        font-size: 12px;
    }

    .cart-title h1 {
        font-size: 29px;
    }

    .summary h2 {
        font-size: 21px;
    }

    #summary-total {
        font-size: 17px;
    }

}

    </style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="cart-header">

    <div class="logo">
        MH CUBES
    </div>

    <nav>

        <a href="index.html">
            🏠 Home
        </a>

    </nav>

</header>


<!-- =========================================================
     CART
========================================================= -->

<main class="cart-page">


    <div class="cart-title">

        <h1>
            🛒 Your Cart
        </h1>

        <p>
            Review your cubes before checkout.
        </p>

    </div>


    <div class="cart-layout">


        <!-- CART ITEMS -->

        <div id="cart-items">

            Your cart is empty.

        </div>


        <!-- ORDER SUMMARY -->

        <aside class="summary">

            <h2>
                Order Summary
            </h2>

            <p id="summary-total">
                Total: PKR 0
            </p>


            <a href="checkout.html">

                <button type="button">
                    Proceed to Checkout ⚡
                </button>

            </a>

        </aside>


    </div>

</main>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script src="assets/js/cart-page.js"></script>


</body>

</html>
