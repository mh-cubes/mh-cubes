
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cart - MH CUBES</title>

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >

    <style>

/* =========================================================
   MH CUBES — CART PAGE
========================================================= */

body {

    margin: 0;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at top,
            rgba(220, 38, 38, 0.12),
            transparent 35%
        ),
        #050505 !important;

    color: white;
}


/* =========================================================
   HEADER
========================================================= */

.cart-header {

    width: 100%;

    background: #050505;

    border-bottom:
        1px solid
        rgba(255, 255, 255, 0.08);

    padding: 18px 30px;

    box-sizing: border-box;

    display: flex;

    align-items: center;

    justify-content: space-between;

    position: relative;

    z-index: 10;
}


.cart-header .logo {

    font-size: 24px;

    font-weight: 900;

    color: #ffffff;

    letter-spacing: 1px;
}


.cart-header nav {

    display: flex;

    align-items: center;

    gap: 12px;
}


.cart-header nav a {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    padding: 10px 18px;

    background: #111111;

    color: #ffffff;

    border:
        1px solid
        rgba(255, 255, 255, 0.12);

    border-radius: 10px;

    text-decoration: none;

    font-weight: 800;

    transition: 0.2s ease;
}


.cart-header nav a:hover {

    background: #1a1a1a;

    border-color: #00ffff;

    color: #00ffff;

    transform: translateY(-2px);
}


/* =========================================================
   CART PAGE
========================================================= */

.cart-page {

    width: 100%;

    max-width: 1150px;

    margin: 0 auto;

    padding: 55px 20px 80px;

    box-sizing: border-box;
}


/* =========================================================
   TITLE
========================================================= */

.cart-title {

    text-align: center;

    margin-bottom: 45px;
}


.cart-title h1 {

    margin: 0;

    font-size: 46px;

    font-weight: 900;

    color: #ffffff;

    text-shadow:
        0 0 15px
        rgba(255, 255, 255, 0.12);
}


.cart-title p {

    margin: 12px 0 0;

    color: #aaa;

    font-size: 16px;
}


/* =========================================================
   CART LAYOUT
========================================================= */

.cart-layout {

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        340px;

    gap: 28px;

    align-items: start;
}


/* =========================================================
   CART ITEMS BOX
========================================================= */

#cart-items {

    min-height: 220px;

    padding: 25px;

    box-sizing: border-box;

    background:
        linear-gradient(
            145deg,
            #101010,
            #070707
        );

    border:
        1px solid
        rgba(255, 255, 255, 0.09);

    border-radius: 20px;

    box-shadow:
        0 20px 50px
        rgba(0, 0, 0, 0.35);
}


/* =========================================================
   PREMIUM SUMMARY
========================================================= */

.summary {

    padding: 26px;

    box-sizing: border-box;

    background:
        linear-gradient(
            145deg,
            #151515,
            #080808
        );

    border:
        1px solid
        rgba(0, 255, 255, 0.18);

    border-radius: 20px;

    box-shadow:
        0 20px 50px
        rgba(0, 0, 0, 0.45),

        0 0 30px
        rgba(0, 255, 255, 0.04);

    position: sticky;

    top: 25px;

    transition:
        border-color 0.3s ease,
        box-shadow 0.3s ease;
}


.summary:hover {

    border-color:
        rgba(0, 255, 255, 0.32);

    box-shadow:
        0 22px 55px
        rgba(0, 0, 0, 0.5),

        0 0 35px
        rgba(0, 255, 255, 0.07);
}


/* =========================================================
   SUMMARY HEADING
========================================================= */

.summary-heading {

    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 25px;
}


.summary-heading span {

    font-size: 23px;
}


.summary-heading h2 {

    margin: 0;

    color: #ffffff;

    font-size: 23px;

    font-weight: 900;
}


/* =========================================================
   SUMMARY ROWS
========================================================= */

.summary-line {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    margin-bottom: 16px;

    color: #aaa;

    font-size: 15px;
}


.summary-line strong {

    color: #ffffff;

    font-size: 15px;

    font-weight: 800;

    text-align: right;
}


.delivery-line strong {

    color: #00ffff;

    font-size: 12px;
}


/* =========================================================
   DIVIDER
========================================================= */

.summary-divider {

    width: 100%;

    height: 1px;

    margin: 20px 0;

    background:
        rgba(255, 255, 255, 0.1);
}


/* =========================================================
   FINAL TOTAL
========================================================= */

.summary-total-row {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    margin-bottom: 22px;
}


.summary-total-row span {

    color: #ffffff;

    font-size: 18px;

    font-weight: 900;
}


.summary-total-row strong {

    color: #00ffff;

    font-size: 24px;

    font-weight: 900;

    text-shadow:
        0 0 12px
        rgba(0, 255, 255, 0.25);
}


/* =========================================================
   HIDDEN OLD TOTAL
========================================================= */

.summary-total-hidden {

    display: none !important;
}


/* =========================================================
   CHECKOUT BUTTON
========================================================= */

.checkout-link {

    display: block;

    text-decoration: none;
}


.checkout-link button {

    width: 100%;

    min-height: 52px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 8px;

    border: none;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #dc2626,
            #ef4444
        );

    color: #ffffff;

    font-size: 16px;

    font-weight: 900;

    cursor: pointer;

    box-shadow:
        0 8px 22px
        rgba(220, 38, 38, 0.22);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        filter 0.2s ease;
}


.checkout-link button:hover {

    transform:
        translateY(-3px);

    filter:
        brightness(1.08);

    box-shadow:
        0 13px 30px
        rgba(220, 38, 38, 0.4);
}


.checkout-link button:active {

    transform:
        translateY(0)
        scale(0.98);
}


.checkout-link button span {

    transition:
        transform 0.25s ease;
}


.checkout-link button:hover span {

    transform:
        translateX(4px);
}


/* =========================================================
   SECURE CHECKOUT
========================================================= */

.secure-checkout {

    margin-top: 15px;

    text-align: center;

    color: #777;

    font-size: 12px;

    font-weight: 700;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 800px) {

    .cart-header {

        padding: 15px 16px;
    }


    .cart-header .logo {

        font-size: 20px;
    }


    .cart-header nav a {

        padding: 9px 13px;

        font-size: 13px;
    }


    .cart-page {

        padding: 35px 12px 55px;
    }


    .cart-title {

        margin-bottom: 28px;
    }


    .cart-title h1 {

        font-size: 34px;
    }


    .cart-title p {

        font-size: 14px;
    }


    .cart-layout {

        grid-template-columns: 1fr;

        gap: 18px;
    }


    .summary {

        position: static;

        padding: 22px;
    }


    #cart-items {

        padding: 15px;
    }


    .summary-heading h2 {

        font-size: 21px;
    }


    .summary-total-row strong {

        font-size: 22px;
    }
}


/* =========================================================
   SMALL PHONES
========================================================= */

@media (max-width: 450px) {

    .cart-header .logo {

        font-size: 18px;
    }


    .cart-header nav a {

        padding: 8px 11px;

        font-size: 12px;
    }


    .cart-title h1 {

        font-size: 29px;
    }


    .summary {

        padding: 19px;
    }


    .summary-line {

        font-size: 14px;
    }


    .summary-line strong {

        font-size: 14px;
    }


    .summary-total-row span {

        font-size: 17px;
    }


    .summary-total-row strong {

        font-size: 21px;
    }


    .checkout-link button {

        min-height: 49px;

        font-size: 15px;
    }

}

    </style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="cart-header">

    <div class="logo">
        MH CUBES
    </div>


    <nav>

        <a href="index.html">
            🏠 Home
        </a>

    </nav>

</header>


<!-- =========================================================
     CART
========================================================= -->

<main class="cart-page">


    <div class="cart-title">

        <h1>
            🛒 Your Cart
        </h1>

        <p>
            Review your cubes before checkout.
        </p>

    </div>


    <div class="cart-layout">


        <!-- =================================================
             CART ITEMS
        ================================================== -->

        <div id="cart-items">

            Your cart is empty.

        </div>


        <!-- =================================================
             ORDER SUMMARY
        ================================================== -->

        <aside class="summary">


            <div class="summary-heading">

                <span>
                    🧾
                </span>

                <h2>
                    Order Summary
                </h2>

            </div>


            <div class="summary-line">

                <span>
                    Subtotal
                </span>

                <strong id="cart-subtotal">
                    PKR 0
                </strong>

            </div>


            <div
                class="summary-line delivery-line"
            >

                <span>
                    Delivery
                </span>

                <strong id="cart-delivery">
                    Calculated at checkout
                </strong>

            </div>


            <div class="summary-divider"></div>


            <div class="summary-total-row">

                <span>
                    Total
                </span>

                <strong id="cart-final-total">
                    PKR 0
                </strong>

            </div>


            <!--
                Kept for compatibility with
                existing cart-page.js.
            -->

            <p
                id="summary-total"
                class="summary-total-hidden"
            >
                Total: PKR 0
            </p>


            <a
                href="checkout.html"
                class="checkout-link"
            >

                <button type="button">

                    Proceed to Checkout

                    <span>
                        ⚡
                    </span>

                </button>

            </a>


            <div class="secure-checkout">

                🔒 Secure Checkout

            </div>


        </aside>


    </div>


</main>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script
    src="assets/js/cart-page.js"
></script>


</body>

</html>
