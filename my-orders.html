<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>My Orders - MH CUBES</title>

<link rel="stylesheet" href="assets/css/style.css">


</head>

<body>

<header>


<div class="logo">
    MH CUBES
</div>

<nav>
    <a href="index.html">🏠 Home</a>
    <a href="cart.html">🛒 Cart</a>
</nav>


</header>

<main class="checkout">


<h1>📦 My Orders</h1>

<div class="checkout-box">

    <h2>Find Your Orders</h2>

    <p>
        Enter the phone number you used when placing your order.
    </p>

    <input
        type="tel"
        id="history-phone"
        placeholder="03XXXXXXXXX"
        maxlength="11"
    >

    <button
        class="place-order"
        id="view-orders-btn"
    >
        🔍 View My Orders
    </button>

    <div id="history-box"></div>

</div>


</main>

<script type="module">

import { db } from "./assets/js/firebase.js";

import {
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const phoneInput =
    document.getElementById("history-phone");

const viewButton =
    document.getElementById("view-orders-btn");

const historyBox =
    document.getElementById("history-box");


viewButton.addEventListener("click", loadOrderHistory);


async function loadOrderHistory(){

    const phone =
        phoneInput.value.trim();


    if(phone === ""){

        historyBox.innerHTML =
            "<h3 style='color:red;'>❌ Please enter your phone number.</h3>";

        return;

    }


    if(!/^03\d{9}$/.test(phone)){

        historyBox.innerHTML =
            "<h3 style='color:red;'>❌ Please enter a valid Pakistani phone number.</h3>";

        return;

    }


    historyBox.innerHTML = `
        <div class="order-loading">
            <div class="loader"></div>
            <h3>🔄 Loading your orders...</h3>
        </div>
    `;


    try{

        const snapshot =
            await getDocs(
                collection(db, "orders")
            );


        const customerOrders = [];


        snapshot.forEach((docSnap) => {

            const order = docSnap.data();


            if(order.phone === phone){

                customerOrders.push({

                    id: docSnap.id,

                    ...order

                });

            }

        });


        if(customerOrders.length === 0){

            historyBox.innerHTML =
                "<h3 style='color:red;'>❌ No orders found for this phone number.</h3>";

            return;

        }


        historyBox.innerHTML = "";


        customerOrders.forEach((order) => {

            let total = 0;

            let productsHTML = "";


            for(const product in order.products || {}){

                const item =
                    order.products[product];


                const price =
                    Number(item.price) || 0;


                const quantity =
                    Number(item.quantity) || 0;


                total += price * quantity;


                productsHTML += `

                    <div class="my-order-product">

                        <span>
                            🧩 ${product}
                        </span>

                        <strong>
                            × ${quantity}
                        </strong>

                    </div>

                `;

            }


            historyBox.innerHTML += `

                <div class="customer-order-card">

                    <div class="order-card-header">

                        <h2>
                            📦 ${order.orderID || "Order"}
                        </h2>

                        <span class="order-status">
                            ${order.status || "Pending 🟡"}
                        </span>

                    </div>


                    <div class="order-details">

                        <p>
                            <strong>📅 Date:</strong>
                            ${order.date || "Not available"}
                        </p>


                        <p>
                            <strong>💳 Payment:</strong>
                            ${order.payment || "Not Selected"}
                        </p>


                        <p>
                            <strong>📍 Address:</strong>
                            ${order.address || "Not available"}
                        </p>

                    </div>


                    <h3>
                        🧩 Products
                    </h3>


                    <div class="my-order-products">

                        ${productsHTML}

                    </div>


                    <div class="order-total">

                        <strong>
                            Total
                        </strong>

                        <strong>
                            PKR ${total}
                        </strong>

                    </div>

                </div>

            `;

        });


    }catch(error){

        console.error(
            "Error loading orders:",
            error
        );


        historyBox.innerHTML =
            "<h3 style='color:red;'>❌ Failed to load orders. Please try again.</h3>";

    }

}

</script>

</body>

</html>
