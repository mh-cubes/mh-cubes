
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Orders - MH CUBES</title>

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >

</head>


<body>


<header>

    <div class="logo">
        MH CUBES
    </div>

    <nav>

        <a href="index.html">
            🏠 Home
        </a>

        <a href="cart.html">
            🛒 Cart
        </a>

    </nav>

</header>



<main class="checkout">


    <h1>
        📦 My Orders
    </h1>


    <div class="checkout-box">

        <h2>
            Your Orders
        </h2>

        <p>
            Your orders are linked securely to your
            customer account.
        </p>


        <div id="history-box">

            <div class="order-loading">

                <div class="loader"></div>

                <h3>
                    🔄 Checking your account...
                </h3>

            </div>

        </div>

    </div>


</main>



<script type="module">


// =========================================
// FIREBASE
// =========================================

import {
    db,
    auth
} from "./assets/js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
    collection,
    getDocs,
    query,
    where
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";



// =========================================
// ELEMENT
// =========================================

const historyBox =
    document.getElementById(
        "history-box"
    );



// =========================================
// LOAD CUSTOMER ORDERS
// =========================================

async function loadOrderHistory(user) {


    historyBox.innerHTML = `

        <div class="order-loading">

            <div class="loader"></div>

            <h3>
                🔄 Loading your orders...
            </h3>

        </div>

    `;


    try {


        // =================================
        // ONLY GET THIS CUSTOMER'S ORDERS
        // =================================

        const ordersQuery = query(

            collection(
                db,
                "orders"
            ),

            where(
                "customerUID",
                "==",
                user.uid
            )

        );


        const snapshot =
            await getDocs(
                ordersQuery
            );


        const customerOrders = [];


        snapshot.forEach(
            function(docSnap) {

                customerOrders.push({

                    id:
                        docSnap.id,

                    ...docSnap.data()

                });

            }
        );



        // =================================
        // NO ORDERS
        // =================================

        if (
            customerOrders.length === 0
        ) {

            historyBox.innerHTML = `

                <h3>
                    📦 No orders found.
                </h3>

                <p>
                    You haven't placed any orders
                    with this account yet.
                </p>

            `;

            return;

        }



        // =================================
        // NEWEST ORDERS FIRST
        // =================================

        customerOrders.sort(
            function(a, b) {

                return Number(
                    b.createdAt || 0
                )
                -
                Number(
                    a.createdAt || 0
                );

            }
        );



        // =================================
        // CLEAR LOADING
        // =================================

        historyBox.innerHTML = "";



        // =================================
        // DISPLAY ORDERS
        // =================================

        customerOrders.forEach(
            function(order) {


                let total = 0;

                let productsHTML = "";



                // =========================
                // PRODUCTS
                // =========================

                for (
                    const product
                    in (order.products || {})
                ) {


                    const item =
                        order.products[
                            product
                        ];


                    const price =
                        Number(
                            item.price
                        ) || 0;


                    const quantity =
                        Number(
                            item.quantity
                        ) || 0;


                    total +=
                        price *
                        quantity;



                    productsHTML += `

                        <div class="my-order-product">

                            <span>
                                🧩 ${product}
                            </span>

                            <strong>
                                × ${quantity}
                            </strong>

                        </div>

                    `;

                }



                // =========================
                // STATUS
                // =========================

                const status =
                    order.status ||
                    "Pending 🟡";



                // =========================
                // ORDER CARD
                // =========================

                historyBox.innerHTML += `

                    <div class="customer-order-card">


                        <div class="order-card-header">

                            <h2>

                                📦
                                ${order.orderID || "Order"}

                            </h2>


                            <span
                                class="order-status"
                            >

                                ${status}

                            </span>

                        </div>



                        <div class="order-details">


                            <p>

                                <strong>
                                    📅 Date:
                                </strong>

                                ${order.date || "Not available"}

                            </p>



                            <p>

                                <strong>
                                    💳 Payment:
                                </strong>

                                ${order.payment || "Not Selected"}

                            </p>



                            <p>

                                <strong>
                                    📍 Address:
                                </strong>

                                ${order.address || "Not available"}

                            </p>



                            <p>

                                <strong>
                                    📱 Phone:
                                </strong>

                                ${order.phone || "Not available"}

                            </p>


                        </div>



                        <h3>
                            🧩 Products
                        </h3>



                        <div class="my-order-products">

                            ${productsHTML}

                        </div>



                        <div class="order-total">

                            <strong>
                                Total
                            </strong>


                            <strong>

                                PKR
                                ${order.total || total}

                            </strong>

                        </div>



                        ${
                            order.notification
                            ?
                            `

                            <div class="order-notification">

                                🔔
                                ${order.notification}

                            </div>

                            `
                            :
                            ""
                        }


                    </div>

                `;

            }
        );


    } catch (error) {


        console.error(
            "Error loading orders:",
            error
        );


        historyBox.innerHTML = `

            <h3 style="color:red;">

                ❌ Failed to load orders.

            </h3>


            <p>

                Please try refreshing the page.

            </p>

        `;

    }

}



// =========================================
// CUSTOMER LOGIN CHECK
// =========================================

onAuthStateChanged(

    auth,

    function(user) {


        if (!user) {


            historyBox.innerHTML = `

                <h3>
                    🔐 Login Required
                </h3>


                <p>
                    Please login to your customer
                    account to view your orders.
                </p>


                <button
                    class="place-order"
                    onclick="
                        window.location.href =
                        'customer-login.html'
                    "
                >

                    Login / Create Account

                </button>

            `;


            return;

        }



        // User is logged in
        loadOrderHistory(user);

    }

);


</script>


</body>

</html>
