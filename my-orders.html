<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Orders - MH CUBES</title>

<link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

<header>

<div class="logo">
MH CUBES
</div>

<nav>

<a href="index.html">🏠 Home</a>

<a href="cart.html">🛒 Cart</a>

</nav>

</header>


<div class="checkout">

<h1>
📦 My Orders
</h1>


<div class="checkout-box">

<h2>
Enter Your Phone Number
</h2>


<input
type="tel"
id="history-phone"
placeholder="03XXXXXXXXX"
maxlength="11">


<button
class="place-order"
onclick="loadOrderHistory()">

View My Orders

</button>


<br><br>


<div id="history-box">

</div>

</div>

</div>


<script type="module">

import { db } from "./assets/js/firebase.js";

import {
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


window.loadOrderHistory = async function(){

    const phone =
        document.getElementById("history-phone")
        .value
        .trim();


    const historyBox =
        document.getElementById("history-box");


    if(phone === ""){

        historyBox.innerHTML =
            "<h3 style='color:red;'>❌ Please enter your phone number.</h3>";

        return;

    }


    if(!/^03\d{9}$/.test(phone)){

        historyBox.innerHTML =
            "<h3 style='color:red;'>❌ Please enter a valid Pakistani phone number.</h3>";

        return;

    }


    historyBox.innerHTML =
        "<h3>🔄 Loading your orders...</h3>";


    try{

        const snapshot =
            await getDocs(
                collection(db, "orders")
            );


        let customerOrders = [];


        snapshot.forEach((docSnap) => {

            const order = docSnap.data();


            if(order.phone === phone){

                customerOrders.push({

                    id: docSnap.id,

                    ...order

                });

            }

        });


        if(customerOrders.length === 0){

            historyBox.innerHTML =
                "<h3 style='color:red;'>❌ No orders found for this phone number.</h3>";

            return;

        }


        historyBox.innerHTML = "";


        customerOrders.forEach((order) => {

            let total = 0;


            let productsHTML = "";


            for(let product in order.products){

                total +=
                    order.products[product].price *
                    order.products[product].quantity;


                productsHTML += `

                    <p>
                        🧩 ${product}
                        × ${order.products[product].quantity}
                    </p>

                `;

            }


            historyBox.innerHTML += `

                <div class="admin-order-box">

                    <h2>
                        📦 Order ID: ${order.orderID}
                    </h2>


                    <p>
                        <b>Status:</b>
                        ${order.status || "Pending"}
                    </p>


                    <p>
                        <b>Date:</b>
                        ${order.date || "Not available"}
                    </p>


                    <p>
                        <b>Payment:</b>
                        ${order.payment || "Not Selected"}
                    </p>


                    <p>
                        <b>Address:</b>
                        ${order.address}
                    </p>


                    <h3>
                        Products
                    </h3>


                    ${productsHTML}


                    <p>
                        <b>Total:</b>
                        PKR ${total}
                    </p>

                </div>

            `;

        });


    }catch(error){

        console.error(
            "Error loading orders:",
            error
        );


        historyBox.innerHTML =
            "<h3 style='color:red;'>❌ Failed to load orders.</h3>";

    }

};

</script>


</body>

</html>
