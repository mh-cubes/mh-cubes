<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>My Orders - MH CUBES</title>

<link
    rel="stylesheet"
    href="assets/css/style.css"
>

<style>

/* =========================================
   MY ORDERS PAGE
========================================= */

body {
    background: #ffffff;
}

/* =========================================
   MAIN AREA
========================================= */

.orders-page {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 20px 70px;
}


/* =========================================
   PAGE TITLE
========================================= */

.orders-title {
    text-align: center;
    margin-bottom: 30px;
}

.orders-title h1 {
    margin: 0;
    font-size: 42px;
    font-weight: 900;
    color: #00ffff;

    text-shadow:
        0 0 10px rgba(0, 255, 255, 0.5),
        0 0 25px rgba(0, 255, 255, 0.25);
}

.orders-title p {
    margin-top: 10px;
    color: #ddd;
    font-size: 16px;
}


/* =========================================
   ACCOUNT BUTTONS
========================================= */

.account-actions {
    display: none;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 35px;
}

.account-action-button {
    border: none;
    padding: 13px 22px;
    border-radius: 12px;
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
}

.home-button {
    background: #dc2626;

    box-shadow:
        0 5px 15px rgba(220, 38, 38, 0.25);
}

.logout-button {
    background: #333;

    box-shadow:
        0 5px 15px rgba(0, 0, 0, 0.3);
}

.account-action-button:hover {
    transform: translateY(-2px);
}

.home-button:hover {
    background: #ff3030;
}

.logout-button:hover {
    background: #555;
}


/* =========================================
   ORDERS CONTAINER
========================================= */

.orders-container {
    background: rgba(5, 10, 15, 0.92);

    border: 1px solid rgba(0, 255, 255, 0.18);

    border-radius: 22px;

    padding: 28px;

    box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.55),
        0 0 30px rgba(0, 255, 255, 0.05);
}

.orders-container > h2 {
    margin-top: 0;

    color: #00ffff;

    text-align: center;

    font-size: 26px;

    text-shadow:
        0 0 10px rgba(0, 255, 255, 0.3);
}

.orders-container > p {
    text-align: center;

    color: #aaa;

    margin-bottom: 28px;
}


/* =========================================
   ORDER CARD
========================================= */

.customer-order-card {
    position: relative;

    background:
        linear-gradient(
            145deg,
            #071a1d,
            #101010,
            #06151a
        );

    border: 1px solid rgba(0, 255, 255, 0.25);

    border-left: 5px solid #00ffff;

    border-radius: 18px;

    padding: 22px;

    margin-bottom: 22px;

    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.35),
        0 0 18px rgba(0, 255, 255, 0.08);

    transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
}

.customer-order-card:hover {
    transform: translateY(-4px);

    border-color: #00ffff;

    box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.45),
        0 0 25px rgba(0, 255, 255, 0.18);
}


/* =========================================
   ORDER HEADER
========================================= */

.order-card-header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    flex-wrap: wrap;

    padding-bottom: 18px;

    margin-bottom: 18px;

    border-bottom: 1px solid rgba(0, 255, 255, 0.15);
}

.order-card-header h2 {
    margin: 0;

    color: #00ffff;

    font-size: 22px;

    word-break: break-word;

    text-shadow:
        0 0 8px rgba(0, 255, 255, 0.25);
}


/* =========================================
   STATUS
========================================= */

.order-status {
    display: inline-block;

    padding: 8px 14px;

    border-radius: 999px;

    background: #00ffff;

    color: #031014;

    font-size: 13px;

    font-weight: 900;

    box-shadow:
        0 4px 15px rgba(0, 255, 255, 0.2);
}


/* =========================================
   ORDER DETAILS
========================================= */

.order-details {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 10px 20px;

    margin-bottom: 22px;
}

.order-details p {
    margin: 0;

    padding: 12px;

    background: rgba(255, 255, 255, 0.035);

    border-radius: 10px;

    color: #ddd;

    border: 1px solid rgba(0, 255, 255, 0.08);

    font-size: 14px;

    word-break: break-word;
}

.order-details strong {
    color: #00ffff;
}


/* =========================================
   PRODUCTS TITLE
========================================= */

.customer-order-card h3 {
    color: #00ffff;

    margin: 20px 0 12px;

    text-shadow:
        0 0 8px rgba(0, 255, 255, 0.2);
}


/* =========================================
   PRODUCTS
========================================= */

.my-order-products {
    display: grid;

    gap: 10px;
}

.my-order-products p {
    margin: 0;

    padding: 13px 15px;

    background:
        linear-gradient(
            90deg,
            #071c20,
            #111111
        );

    border: 1px solid rgba(0, 255, 255, 0.12);

    border-radius: 10px;

    color: #ddd;

    transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

.my-order-products p:hover {
    transform: translateX(3px);

    border-color: #00ffff;

    box-shadow:
        0 0 12px rgba(0, 255, 255, 0.1);
}

.my-order-products strong {
    color: #00ffff;
}


/* =========================================
   TOTAL
========================================= */

.order-total {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-top: 22px;

    padding: 16px 18px;

    background:
        linear-gradient(
            90deg,
            #00ffff,
            #008cff
        );

    border-radius: 12px;

    color: #031014;

    font-size: 18px;

    font-weight: 900;

    box-shadow:
        0 7px 20px rgba(0, 255, 255, 0.15);
}


/* =========================================
   NOTIFICATION
========================================= */

.order-notification {
    margin-top: 15px;

    padding: 14px 16px;

    background: rgba(0, 255, 255, 0.06);

    border: 1px solid rgba(0, 255, 255, 0.3);

    border-radius: 10px;

    color: #00ffff;

    font-weight: 700;
}


/* =========================================
   TRACK BUTTON
========================================= */

.track-order-btn {
    display: block;

    margin-top: 18px;

    padding: 14px 18px;

    text-align: center;

    background: #00ffff;

    color: #031014;

    border-radius: 12px;

    text-decoration: none;

    font-weight: 900;

    font-size: 16px;

    transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;

    box-shadow:
        0 6px 18px rgba(0, 255, 255, 0.15);
}

.track-order-btn:hover {
    background: #008cff;

    color: white;

    transform: translateY(-2px);

    box-shadow:
        0 8px 22px rgba(0, 140, 255, 0.3);
}


/* =========================================
   LOADING
========================================= */

.order-loading {
    text-align: center;

    padding: 50px 20px;

    color: white;
}

.loader {
    width: 48px;

    height: 48px;

    border: 5px solid #333;

    border-top: 5px solid #00ffff;

    border-radius: 50%;

    animation: spin 1s linear infinite;

    margin: 0 auto 18px;
}

.order-loading h3 {
    color: #00ffff;
}


/* =========================================
   EMPTY / ERROR STATE
========================================= */

.orders-message {
    text-align: center;

    padding: 55px 20px;
}

.orders-message .message-icon {
    font-size: 60px;

    margin-bottom: 15px;
}

.orders-message h2 {
    color: #00ffff;

    margin-bottom: 10px;
}

.orders-message p {
    color: #aaa;

    line-height: 1.6;
}


/* =========================================
   ANIMATION
========================================= */

@keyframes spin {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 700px) {

    .orders-page {
        width: 100%;
        box-sizing: border-box;
        padding: 22px 10px 45px;
    }


    /* ================================
       TITLE
    ================================= */

    .orders-title {
        margin-bottom: 22px;
    }


    .orders-title h1 {
        font-size: 30px;
        line-height: 1.2;
    }


    .orders-title p {
        font-size: 13px;
        line-height: 1.5;
        padding: 0 8px;
    }


    /* ================================
       ORDERS CONTAINER
    ================================= */

    .orders-container {
        width: 100%;
        box-sizing: border-box;

        padding: 12px;

        border-radius: 16px;
    }


    .orders-container > h2 {
        font-size: 21px;
    }


    .orders-container > p {
        font-size: 13px;
        line-height: 1.5;
        margin-bottom: 20px;
    }


    /* ================================
       ORDER CARD
    ================================= */

    .customer-order-card {

        width: 100%;
        box-sizing: border-box;

        padding: 14px;

        margin-bottom: 16px;

        border-radius: 14px;

        border-left: 4px solid #00ffff;

        overflow: hidden;
    }


    .customer-order-card:hover {
        transform: none;
    }


    /* ================================
       ORDER HEADER
    ================================= */

    .order-card-header {

        display: flex;

        flex-direction: column;

        align-items: stretch;

        gap: 10px;

        padding-bottom: 14px;

        margin-bottom: 14px;
    }


  .order-card-header h2 {
    font-size: 15px;
    line-height: 1.3;
    word-break: break-all;
}
    .order-status {

        width: fit-content;

        font-size: 11px;

        padding: 6px 10px;
    }


    /* ================================
       ORDER DETAILS
    ================================= */

    .order-details {

        display: flex;

        flex-direction: column;

        gap: 8px;

        margin-bottom: 18px;
    }


    .order-details p {

        width: 100%;

        box-sizing: border-box;

        padding: 10px;

        font-size: 13px;

        line-height: 1.5;

        overflow-wrap: anywhere;
    }


    .order-details strong {
        color: #00ffff;
    }


    /* ================================
       PRODUCT SECTION
    ================================= */

    .customer-order-card h3 {

        font-size: 17px;

        margin: 18px 0 10px;
    }


    .my-order-products {

        display: flex;

        flex-direction: column;

        gap: 8px;
    }


    .my-order-products p {

        padding: 11px;

        font-size: 13px;

        line-height: 1.5;

        overflow-wrap: anywhere;
    }


    /* ================================
       TOTAL
    ================================= */

    .order-total {

        display: flex;

        flex-direction: column;

        align-items: stretch;

        gap: 5px;

        margin-top: 18px;

        padding: 13px;

        font-size: 15px;

        line-height: 1.4;

        border-radius: 10px;
    }


    /* ================================
       TRACK BUTTON
    ================================= */

    .track-order-btn {

        width: 100%;

        box-sizing: border-box;

        padding: 13px;

        margin-top: 14px;

        font-size: 14px;

        border-radius: 10px;
    }


    /* ================================
       NOTIFICATION
    ================================= */

    .order-notification {

        padding: 11px;

        font-size: 13px;

        line-height: 1.5;
    }


    /* ================================
       LOADING
    ================================= */

    .order-loading {

        padding: 40px 10px;
    }


    .order-loading h3 {

        font-size: 16px;
    }


    /* ================================
       EMPTY / ERROR
    ================================= */

    .orders-message {

        padding: 40px 10px;
    }


    .orders-message .message-icon {

        font-size: 50px;
    }


    .orders-message h2 {

        font-size: 20px;
    }


    .orders-message p {

        font-size: 14px;
    }

}

</style>

</head>


<body>


<!-- =========================================
     BEAUTIFUL PAGE LOADING SCREEN
========================================= -->

<div id="page-loading">

    <div class="loading-content">

        <div class="loading-logo">
            🧩
        </div>

        <div class="page-loader"></div>

        <h2>
            MY ORDERS
        </h2>

        <p>
            Fetching your orders...
        </p>

    </div>

</div>


<!-- =========================================
     HEADER
========================================= -->

<header>

    <div class="logo">
        MH CUBES
    </div>


    <nav>

        <a href="index.html">
            🏠 Home
        </a>

        <a href="cart.html">
            🛒 Cart
        </a>

    </nav>

</header>


<!-- =========================================
     MAIN
========================================= -->

<main class="orders-page">


    <div class="orders-title">

        <h1>
            📦 My Orders
        </h1>

        <p>
            View and track all your MH CUBES orders
        </p>

    </div>


    <!-- =====================================
         ACCOUNT BUTTONS
    ====================================== -->

    <div
        id="account-actions"
        class="account-actions"
    >

        <a
            href="index.html"
            class="account-action-button home-button"
        >
            🏠 Continue Shopping
        </a>


        <button
            id="logout-button"
            class="account-action-button logout-button"
            type="button"
        >
            🚪 Logout
        </button>

    </div>


    <!-- =====================================
         ORDERS CONTAINER
    ====================================== -->

    <div class="orders-container">

        <h2>
            Your Orders
        </h2>


        <p>
            Your orders are securely linked to your
            customer account.
        </p>


        <div id="order-box"></div>

    </div>


</main>


<!-- =========================================
     JAVASCRIPT
========================================= -->

<script
    type="module"
    src="assets/js/orders.js"
></script>

<script
    src="assets/js/page-loading.js"
></script>


</body>

</html>
