
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Orders - MH CUBES</title>

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >

    <style>

        /* =========================================
           PAGE
        ========================================= */

        body {
            background:
                radial-gradient(
                    circle at top left,
                    rgba(220, 38, 38, 0.06),
                    transparent 30%
                ),
                #f7f7f7;

            min-height: 100vh;
        }


        /* =========================================
           TOP NAVIGATION
        ========================================= */

        .orders-nav {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 12px;

            padding: 18px 15px;

            box-sizing: border-box;

            flex-wrap: wrap;
        }

        .orders-nav a {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-width: 135px;

            padding: 12px 20px;

            border-radius: 12px;

            background: #ffffff;

            color: #222;

            text-decoration: none;

            font-size: 14px;
            font-weight: 800;

            border: 1px solid #e5e5e5;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.08);

            transition: 0.2s ease;
        }

        .orders-nav a:hover {
            transform: translateY(-2px);

            border-color: #dc2626;

            color: #dc2626;
        }


        /* =========================================
           MAIN
        ========================================= */

        .orders-page {
            width: 100%;

            max-width: 1050px;

            margin: 0 auto;

            padding: 20px 20px 70px;

            box-sizing: border-box;
        }


        /* =========================================
           PAGE HERO
        ========================================= */

        .orders-hero {
            position: relative;

            overflow: hidden;

            padding: 38px 25px;

            border-radius: 24px;

            text-align: center;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #111827,
                    #2563eb
                );

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.18);

            margin-bottom: 25px;
        }

        .orders-hero::before {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            right: -60px;
            top: -80px;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.08);
        }

        .orders-hero::after {
            content: "";

            position: absolute;

            width: 130px;
            height: 130px;

            left: -50px;
            bottom: -70px;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.06);
        }

        .orders-hero-icon {
            position: relative;
            z-index: 1;

            font-size: 48px;

            margin-bottom: 8px;
        }

        .orders-hero h1 {
            position: relative;
            z-index: 1;

            margin: 0;

            font-size: 38px;
            font-weight: 900;
        }

        .orders-hero p {
            position: relative;
            z-index: 1;

            margin: 10px 0 0;

            font-size: 15px;

            opacity: 0.9;
        }


        /* =========================================
           ACCOUNT ACTIONS
        ========================================= */

        .account-actions {
            display: none;

            justify-content: center;

            align-items: center;

            gap: 12px;

            flex-wrap: wrap;

            margin-bottom: 25px;
        }

        .account-action-button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            padding: 12px 20px;

            border-radius: 11px;

            border: none;

            text-decoration: none;

            color: white;

            font-size: 14px;
            font-weight: 800;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .account-button {
            background: #2563eb;
        }

        .home-button {
            background: #dc2626;
        }

        .logout-button {
            background: #333333;
        }

        .account-action-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 7px 18px rgba(0,0,0,0.15);
        }


        /* =========================================
           ORDERS PANEL
        ========================================= */

        .orders-container {
            width: 100%;

            background: white;

            border-radius: 22px;

            padding: 28px;

            box-sizing: border-box;

            border: 1px solid #e8e8e8;

            box-shadow:
                0 12px 35px rgba(0,0,0,0.08);
        }

        .orders-container-header {
            text-align: center;

            margin-bottom: 25px;
        }

        .orders-container-header h2 {
            margin: 0;

            font-size: 25px;

            color: #222;
        }

        .orders-container-header p {
            margin: 8px 0 0;

            color: #777;

            font-size: 14px;
        }


        /* =========================================
           ORDER CARD
        ========================================= */

        .customer-order-card {
            width: 100%;

            background: #ffffff;

            border: 1px solid #e5e7eb;

            border-left: 5px solid #2563eb;

            border-radius: 18px;

            padding: 22px;

            margin-bottom: 20px;

            box-sizing: border-box;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.07);

            transition: 0.25s ease;
        }

        .customer-order-card:hover {
            transform: translateY(-3px);

            box-shadow:
                0 14px 32px rgba(0,0,0,0.11);
        }


        /* =========================================
           ORDER HEADER
        ========================================= */

        .order-card-header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            flex-wrap: wrap;

            padding-bottom: 16px;

            margin-bottom: 18px;

            border-bottom: 1px solid #eeeeee;
        }

        .order-card-header h2 {
            margin: 0;

            color: #222;

            font-size: 20px;

            word-break: break-word;
        }


        /* =========================================
           STATUS
        ========================================= */

        .order-status {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            padding: 7px 13px;

            border-radius: 999px;

            background: #fff7ed;

            color: #c2410c;

            border: 1px solid #fed7aa;

            font-size: 12px;

            font-weight: 900;

            white-space: nowrap;
        }


        /* =========================================
           ORDER DETAILS
        ========================================= */

        .order-details {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 10px;

            margin-bottom: 22px;
        }

        .order-details p {
            margin: 0;

            padding: 12px;

            background: #f8fafc;

            border: 1px solid #eef0f3;

            border-radius: 10px;

            color: #555;

            font-size: 13px;

            line-height: 1.5;

            word-break: break-word;

            overflow-wrap: anywhere;
        }

        .order-details strong {
            color: #222;

            font-weight: 800;
        }


        /* =========================================
           PRODUCTS
        ========================================= */

        .customer-order-card h3 {
            margin: 20px 0 12px;

            color: #222;

            font-size: 17px;
        }

        .my-order-products {
            width: 100%;

            display: flex;

            flex-direction: column;

            gap: 8px;
        }

        .my-order-product-item {
            width: 100%;

            display: flex;

            align-items: center;

            gap: 12px;

            padding: 10px;

            background: #f8fafc;

            border: 1px solid #edf0f3;

            border-radius: 12px;

            box-sizing: border-box;
        }

        .my-order-product-image {
            width: 52px !important;
            height: 52px !important;

            min-width: 52px !important;
            min-height: 52px !important;

            max-width: 52px !important;
            max-height: 52px !important;

            flex: 0 0 52px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: white;

            border-radius: 9px;

            overflow: hidden;

            border: 1px solid #e5e7eb;

            box-sizing: border-box;
        }

        .my-order-product-image img,
        .my-order-product-item img {
            width: 100% !important;
            height: 100% !important;

            max-width: 100% !important;
            max-height: 100% !important;

            object-fit: contain !important;

            display: block;

            margin: 0;
        }

        .my-order-product-info {
            min-width: 0;

            flex: 1;

            display: flex;

            flex-direction: column;

            gap: 4px;
        }

        .my-order-product-info strong {
            color: #222;

            font-size: 14px;

            word-break: break-word;

            overflow-wrap: anywhere;
        }

        .my-order-product-info span {
            color: #777;

            font-size: 12px;
        }


        /* =========================================
           TOTAL
        ========================================= */

        .order-total {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 10px;

            margin-top: 20px;

            padding: 15px 17px;

            background:
                linear-gradient(
                    135deg,
                    #111827,
                    #2563eb
                );

            border-radius: 12px;

            color: white;

            font-size: 17px;

            font-weight: 900;

            box-sizing: border-box;
        }


        /* =========================================
           NOTIFICATION
        ========================================= */

        .order-notification {
            margin-top: 14px;

            padding: 12px 14px;

            background: #eff6ff;

            border: 1px solid #bfdbfe;

            border-radius: 10px;

            color: #1d4ed8;

            font-size: 13px;

            font-weight: 700;

            line-height: 1.5;

            word-break: break-word;
        }


        /* =========================================
           TRACK BUTTON
        ========================================= */

        .track-order-btn {
            display: flex;

            align-items: center;
            justify-content: center;

            width: 100%;

            box-sizing: border-box;

            margin-top: 15px;

            padding: 13px 18px;

            background: #2563eb;

            color: white;

            border-radius: 11px;

            text-decoration: none;

            font-weight: 800;

            font-size: 14px;

            transition: 0.2s ease;
        }

        .track-order-btn:hover {
            background: #1d4ed8;

            transform: translateY(-2px);

            box-shadow:
                0 7px 18px rgba(37,99,235,0.22);
        }


        /* =========================================
           CANCEL BUTTON
        ========================================= */

        .cancel-order-btn {
            width: 100%;

            margin-top: 9px;

            padding: 13px 18px;

            border: none;

            border-radius: 11px;

            background: #fee2e2;

            color: #b91c1c;

            border: 1px solid #fecaca;

            font-size: 14px;

            font-weight: 800;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .cancel-order-btn:hover {
            background: #dc2626;

            color: white;

            transform: translateY(-2px);
        }


        /* =========================================
           LOADING
        ========================================= */

        .order-loading {
            text-align: center;

            padding: 55px 20px;

            color: #555;
        }

        .loader {
            width: 45px;
            height: 45px;

            border: 5px solid #e5e7eb;

            border-top: 5px solid #2563eb;

            border-radius: 50%;

            animation: spin 0.9s linear infinite;

            margin: 0 auto 18px;
        }

        .order-loading h3 {
            color: #2563eb;

            margin: 0;
        }


        /* =========================================
           EMPTY / ERROR
        ========================================= */

        .orders-message {
            text-align: center;

            padding: 55px 20px;
        }

        .orders-message .message-icon {
            font-size: 55px;
        }

        .orders-message h2 {
            color: #222;

            margin: 12px 0 8px;
        }

        .orders-message p {
            color: #777;

            line-height: 1.6;

            margin: 0;
        }


        /* =========================================
           ANIMATION
        ========================================= */

        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            .orders-nav {
                padding: 14px 10px;

                gap: 8px;
            }

            .orders-nav a {
                min-width: 120px;

                padding: 10px 14px;

                font-size: 13px;
            }

            .orders-page {
                padding: 10px 10px 45px;
            }

            .orders-hero {
                padding: 30px 18px;

                border-radius: 19px;
            }

            .orders-hero-icon {
                font-size: 40px;
            }

            .orders-hero h1 {
                font-size: 29px;
            }

            .orders-hero p {
                font-size: 13px;

                line-height: 1.5;
            }

            .orders-container {
                padding: 13px;

                border-radius: 16px;
            }

            .orders-container-header h2 {
                font-size: 21px;
            }

            .orders-container-header p {
                font-size: 12px;
            }

            .customer-order-card {
                padding: 13px;

                border-radius: 13px;

                border-left-width: 4px;
            }

            .order-card-header {
                align-items: flex-start;

                flex-direction: column;

                gap: 8px;

                padding-bottom: 12px;

                margin-bottom: 12px;
            }

            .order-card-header h2 {
                font-size: 14px;

                word-break: break-all;
            }

            .order-status {
                font-size: 10px;

                padding: 5px 9px;
            }

            .order-details {
                grid-template-columns: 1fr;

                gap: 7px;

                margin-bottom: 15px;
            }

            .order-details p {
                padding: 9px;

                font-size: 12px;
            }

            .customer-order-card h3 {
                font-size: 15px;

                margin: 15px 0 9px;
            }

            .my-order-product-item {
                padding: 8px;

                gap: 9px;

                border-radius: 9px;
            }

            .my-order-product-image {
                width: 43px !important;
                height: 43px !important;

                min-width: 43px !important;
                min-height: 43px !important;

                max-width: 43px !important;
                max-height: 43px !important;

                flex: 0 0 43px;
            }

            .my-order-product-info strong {
                font-size: 12px;
            }

            .my-order-product-info span {
                font-size: 10px;
            }

            .order-total {
                flex-direction: column;

                align-items: stretch;

                gap: 4px;

                padding: 12px;

                font-size: 14px;
            }

            .order-notification {
                padding: 9px;

                font-size: 11px;
            }

            .track-order-btn,
            .cancel-order-btn {
                padding: 12px;

                font-size: 12px;

                border-radius: 9px;
            }

            .order-loading {
                padding: 40px 10px;
            }

            .orders-message {
                padding: 40px 10px;
            }

            .orders-message .message-icon {
                font-size: 48px;
            }

            .orders-message h2 {
                font-size: 20px;
            }

            .orders-message p {
                font-size: 12px;
            }

        }

    </style>

</head>


<body>


<!-- =========================================
     NAVIGATION
========================================= -->

<nav class="orders-nav">

    <a href="index.html">
        🏠 Home
    </a>

    <a href="customer-account.html">
        👤 My Account
    </a>

    <a href="cart.html">
        🛒 Cart
    </a>

</nav>


<!-- =========================================
     MAIN
========================================= -->

<main class="orders-page">


    <!-- HERO -->

    <section class="orders-hero">

        <div class="orders-hero-icon">
            📦
        </div>

        <h1>
            My Orders
        </h1>

        <p>
            View and track all your MH CUBES orders
        </p>

    </section>


    <!-- ACCOUNT ACTIONS -->

    <div
        id="account-actions"
        class="account-actions"
    >

        <a
            href="customer-account.html"
            class="account-action-button account-button"
        >
            👤 My Account
        </a>

        <a
            href="index.html"
            class="account-action-button home-button"
        >
            🛍️ Continue Shopping
        </a>

        <button
            id="logout-button"
            class="account-action-button logout-button"
            type="button"
        >
            🚪 Logout
        </button>

    </div>


    <!-- ORDERS -->

    <section class="orders-container">

        <div class="orders-container-header">

            <h2>
                Your Orders
            </h2>

            <p>
                Your orders are securely linked to your
                customer account.
            </p>

        </div>

        <div id="order-box"></div>

    </section>


</main>


<!-- =========================================
     FIREBASE ORDER SYSTEM
========================================= -->

<script
    type="module"
    src="assets/js/orders.js"
></script>


</body>

</html>
