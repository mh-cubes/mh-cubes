
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>My Orders - MH CUBES</title>

<link
    rel="stylesheet"
    href="assets/css/style.css"
>

<style>

.account-actions {
    display: none;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin: 20px 0;
}

.account-action-button {
    border: none;
    padding: 12px 20px;
    border-radius: 10px;
    color: white;
    font-size: 15px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
}

.home-button {
    background: #2563eb;
}

.logout-button {
    background: #dc2626;
}

.account-action-button:hover {
    opacity: 0.9;
}

.order-loading {
    text-align: center;
    padding: 30px;
}

.loader {
    width: 45px;
    height: 45px;
    border: 5px solid #ddd;
    border-top: 5px solid #2563eb;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 15px;
}

@keyframes spin {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}

</style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header>

    <div class="logo">
        MH CUBES
    </div>


    <nav>

        <a href="index.html">
            🏠 Home
        </a>

        <a href="cart.html">
            🛒 Cart
        </a>

    </nav>

</header>



<!-- ================= MAIN ================= -->

<main class="checkout">


    <h1>
        📦 My Orders
    </h1>


    <!-- ================= ACCOUNT BUTTONS ================= -->

    <div
        id="account-actions"
        class="account-actions"
    >

        <a
            href="index.html"
            class="account-action-button home-button"
        >
            🏠 Home
        </a>


        <button
            id="logout-button"
            class="account-action-button logout-button"
        >
            🚪 Logout
        </button>

    </div>



    <!-- ================= ORDERS BOX ================= -->

    <div class="checkout-box">

        <h2>
            Your Orders
        </h2>


        <p>
            Your orders are linked securely to your
            customer account.
        </p>


        <div id="order-box">

            <div class="order-loading">

                <div class="loader"></div>

                <h3>
                    🔄 Checking your account...
                </h3>

            </div>

        </div>

    </div>


</main>



<!-- ================= JAVASCRIPT ================= -->

<script
    type="module"
    src="assets/js/orders.js"
></script>


</body>

</html>
