
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Orders - MH CUBES</title>

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >

    <style>

        /* =========================================
           MY ORDERS PAGE
        ========================================= */

        body {
            background: #ffffff !important;
        }


        /* =========================================
           MAIN AREA
        ========================================= */

        .orders-page {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px 70px;
            box-sizing: border-box;
        }


        /* =========================================
           PAGE TITLE
        ========================================= */

        .orders-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .orders-title h1 {
            margin: 0;

            font-size: 42px;
            font-weight: 900;

            color: #00ffff;

            text-shadow:
                0 0 10px rgba(0, 255, 255, 0.5),
                0 0 25px rgba(0, 255, 255, 0.25);
        }

        .orders-title p {
            margin-top: 10px;

            color: #555;

            font-size: 16px;
        }


        /* =========================================
           ACCOUNT BUTTONS
        ========================================= */

        .account-actions {
            display: none;

            justify-content: center;

            gap: 14px;

            flex-wrap: wrap;

            margin-bottom: 35px;
        }

        .account-action-button {
            border: none;

            padding: 13px 22px;

            border-radius: 12px;

            color: white;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            text-decoration: none;

            display: inline-block;

            transition: 0.2s ease;
        }

        .home-button {
            background: #dc2626;
        }

        .logout-button {
            background: #333;
        }

        .account-action-button:hover {
            transform: translateY(-2px);
        }


        /* =========================================
           ORDERS CONTAINER
        ========================================= */

        .orders-container {
            width: 100%;

            background: rgba(5, 10, 15, 0.95);

            border: 1px solid rgba(0, 255, 255, 0.18);

            border-radius: 22px;

            padding: 28px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.35),
                0 0 30px rgba(0, 255, 255, 0.05);

            box-sizing: border-box;
        }

        .orders-container > h2 {
            margin-top: 0;

            color: #00ffff;

            text-align: center;

            font-size: 26px;
        }

        .orders-container > p {
            text-align: center;

            color: #aaa;

            margin-bottom: 28px;
        }


        /* =========================================
           ORDER CARD
        ========================================= */

        .customer-order-card {
            width: 100%;

            background:
                linear-gradient(
                    145deg,
                    #071a1d,
                    #101010,
                    #06151a
                );

            border: 1px solid rgba(0, 255, 255, 0.25);

            border-left: 5px solid #00ffff;

            border-radius: 18px;

            padding: 22px;

            margin-bottom: 22px;

            overflow: hidden;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.35),
                0 0 18px rgba(0, 255, 255, 0.08);

            box-sizing: border-box;
        }


        /* =========================================
           ORDER HEADER
        ========================================= */

        .order-card-header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            flex-wrap: wrap;

            padding-bottom: 18px;

            margin-bottom: 18px;

            border-bottom: 1px solid rgba(0, 255, 255, 0.15);
        }

        .order-card-header h2 {
            margin: 0;

            color: #00ffff;

            font-size: 22px;

            word-break: break-word;

            max-width: 100%;
        }


        /* =========================================
           STATUS
        ========================================= */

        .order-status {
            display: inline-block;

            padding: 8px 14px;

            border-radius: 999px;

            background: #00ffff;

            color: #031014;

            font-size: 13px;

            font-weight: 900;

            white-space: nowrap;
        }


        /* =========================================
           ORDER DETAILS
        ========================================= */

        .order-details {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 10px 20px;

            margin-bottom: 22px;
        }

        .order-details p {
            margin: 0;

            padding: 12px;

            background: rgba(255, 255, 255, 0.035);

            border-radius: 10px;

            color: #ddd;

            border: 1px solid rgba(0, 255, 255, 0.08);

            font-size: 14px;

            word-break: break-word;

            overflow-wrap: anywhere;
        }

        .order-details strong {
            color: #00ffff;
        }


        /* =========================================
           PRODUCTS TITLE
        ========================================= */

        .customer-order-card h3 {
            color: #00ffff;

            margin: 20px 0 12px;

            font-size: 18px;
        }


        /* =========================================
           PRODUCTS CONTAINER
        ========================================= */

        .my-order-products {
            width: 100%;

            display: flex;

            flex-direction: column;

            gap: 10px;

            box-sizing: border-box;
        }


        /* =========================================
           PRODUCT ITEM
        ========================================= */

        .my-order-product-item {
            width: 100%;

            display: flex;

            align-items: center;

            gap: 12px;

            padding: 10px;

            box-sizing: border-box;

            background:
                linear-gradient(
                    90deg,
                    #071c20,
                    #111111
                );

            border: 1px solid rgba(0, 255, 255, 0.12);

            border-radius: 12px;

            overflow: hidden;
        }


        /* =========================================
           PRODUCT IMAGE BOX
        ========================================= */

        .my-order-product-image {
            width: 50px !important;
            height: 50px !important;

            min-width: 50px !important;
            min-height: 50px !important;

            max-width: 50px !important;
            max-height: 50px !important;

            flex: 0 0 50px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #ffffff;

            border-radius: 8px;

            overflow: hidden;

            box-sizing: border-box;
        }


        /* =========================================
           PRODUCT IMAGE
        ========================================= */

        .my-order-product-image img,
        .my-order-product-item img {
            width: 100% !important;
            height: 100% !important;

            max-width: 100% !important;
            max-height: 100% !important;

            object-fit: contain !important;

            display: block;

            margin: 0;

            box-sizing: border-box;
        }


        /* =========================================
           PRODUCT INFO
        ========================================= */

        .my-order-product-info {
            min-width: 0;

            flex: 1;

            display: flex;

            flex-direction: column;

            gap: 5px;

            overflow: hidden;
        }

        .my-order-product-info strong {
            color: #00ffff;

            font-size: 15px;

            word-break: break-word;

            overflow-wrap: anywhere;
        }

        .my-order-product-info span {
            color: #ddd;

            font-size: 13px;

            word-break: break-word;
        }


        /* =========================================
           TOTAL
        ========================================= */

        .order-total {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 10px;

            margin-top: 22px;

            padding: 16px 18px;

            background:
                linear-gradient(
                    90deg,
                    #00ffff,
                    #008cff
                );

            border-radius: 12px;

            color: #031014;

            font-size: 18px;

            font-weight: 900;

            box-sizing: border-box;
        }


        /* =========================================
           NOTIFICATION
        ========================================= */

        .order-notification {
            margin-top: 15px;

            padding: 14px 16px;

            background: rgba(0, 255, 255, 0.06);

            border: 1px solid rgba(0, 255, 255, 0.3);

            border-radius: 10px;

            color: #00ffff;

            font-weight: 700;

            word-break: break-word;
        }


        /* =========================================
           TRACK BUTTON
        ========================================= */

        .track-order-btn {
            display: block;

            width: 100%;

            box-sizing: border-box;

            margin-top: 18px;

            padding: 14px 18px;

            text-align: center;

            background: #00ffff;

            color: #031014;

            border-radius: 12px;

            text-decoration: none;

            font-weight: 900;

            font-size: 16px;
        }


        /* =========================================
           LOADING INSIDE ORDERS
        ========================================= */

        .order-loading {
            text-align: center;

            padding: 50px 20px;

            color: white;
        }

        .loader {
            width: 48px;
            height: 48px;

            border: 5px solid #333;

            border-top: 5px solid #00ffff;

            border-radius: 50%;

            animation: spin 1s linear infinite;

            margin: 0 auto 18px;
        }

        .order-loading h3 {
            color: #00ffff;
        }


        /* =========================================
           EMPTY / ERROR
        ========================================= */

        .orders-message {
            text-align: center;

            padding: 55px 20px;
        }

        .orders-message .message-icon {
            font-size: 60px;
        }

        .orders-message h2 {
            color: #00ffff;
        }

        .orders-message p {
            color: #aaa;

            line-height: 1.6;
        }


        /* =========================================
           ANIMATION
        ========================================= */

        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            .orders-page {
                width: 100%;

                padding: 20px 8px 45px;
            }


            .orders-title {
                margin-bottom: 20px;
            }

            .orders-title h1 {
                font-size: 30px;
            }

            .orders-title p {
                font-size: 13px;

                line-height: 1.5;
            }


            .orders-container {
                width: 100%;

                padding: 10px;

                border-radius: 15px;
            }

            .orders-container > h2 {
                font-size: 21px;
            }

            .orders-container > p {
                font-size: 13px;

                line-height: 1.5;

                margin-bottom: 20px;
            }


            .customer-order-card {
                width: 100%;

                padding: 12px;

                margin-bottom: 15px;

                border-radius: 13px;

                border-left: 4px solid #00ffff;
            }


            .order-card-header {
                display: flex;

                flex-direction: column;

                align-items: flex-start;

                gap: 8px;

                padding-bottom: 12px;

                margin-bottom: 12px;
            }


            .order-card-header h2 {
                width: 100%;

                font-size: 13px;

                line-height: 1.3;

                word-break: break-all;

                overflow-wrap: anywhere;
            }


            .order-status {
                font-size: 10px;

                padding: 5px 9px;
            }


            .order-details {
                display: flex;

                flex-direction: column;

                gap: 7px;

                margin-bottom: 16px;
            }

            .order-details p {
                width: 100%;

                padding: 9px;

                font-size: 12px;

                line-height: 1.5;
            }


            .customer-order-card h3 {
                font-size: 16px;

                margin: 16px 0 9px;
            }


            .my-order-products {
                width: 100%;

                gap: 7px;
            }


            .my-order-product-item {
                width: 100%;

                gap: 9px;

                padding: 8px;

                border-radius: 9px;
            }


            .my-order-product-image {
                width: 42px !important;
                height: 42px !important;

                min-width: 42px !important;
                min-height: 42px !important;

                max-width: 42px !important;
                max-height: 42px !important;

                flex: 0 0 42px;
            }


            .my-order-product-image img,
            .my-order-product-item img {
                width: 100% !important;
                height: 100% !important;

                max-width: 100% !important;
                max-height: 100% !important;

                object-fit: contain !important;
            }


            .my-order-product-info {
                min-width: 0;

                flex: 1;
            }

            .my-order-product-info strong {
                font-size: 13px;
            }

            .my-order-product-info span {
                font-size: 11px;
            }


            .order-total {
                flex-direction: column;

                align-items: stretch;

                gap: 4px;

                margin-top: 16px;

                padding: 12px;

                font-size: 14px;
            }


            .order-notification {
                padding: 10px;

                font-size: 12px;

                line-height: 1.5;
            }


            .track-order-btn {
                padding: 12px;

                margin-top: 13px;

                font-size: 13px;

                border-radius: 9px;
            }


            .order-loading {
                padding: 40px 10px;
            }


            .orders-message {
                padding: 40px 10px;
            }

            .orders-message .message-icon {
                font-size: 50px;
            }

            .orders-message h2 {
                font-size: 20px;
            }

            .orders-message p {
                font-size: 13px;
            }

        }
.cancel-order-btn {

    width: 100%;

    margin-top: 12px;

    padding: 14px 18px;

    border: none;

    border-radius: 12px;

    background: #dc2626;

    color: #ffffff;

    font-size: 15px;

    font-weight: 900;

    cursor: pointer;

    transition: 0.2s ease;
}


.cancel-order-btn:hover {

    background: #ef4444;

    transform: translateY(-2px);

}


.cancel-order-btn:active {

    transform: scale(0.98);

}
    </style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header>

    <div class="logo">
        MH CUBES
    </div>

    <nav>

        <a href="index.html">
            🏠 Home
        </a>

        <a href="cart.html">
            🛒 Cart
        </a>

    </nav>

</header>


<!-- =========================================
     MAIN
========================================= -->

<main class="orders-page">

    <div class="orders-title">

        <h1>
            📦 My Orders
        </h1>

        <p>
            View and track all your MH CUBES orders
        </p>

    </div>


    <!-- ACCOUNT BUTTONS -->

    <div
        id="account-actions"
        class="account-actions"
    >

        <a
            href="index.html"
            class="account-action-button home-button"
        >
            🏠 Continue Shopping
        </a>

        <button
            id="logout-button"
            class="account-action-button logout-button"
            type="button"
        >
            🚪 Logout
        </button>

    </div>


    <!-- ORDERS -->

    <div class="orders-container">

        <h2>
            Your Orders
        </h2>

        <p>
            Your orders are securely linked to your
            customer account.
        </p>

        <div id="order-box"></div>

    </div>

</main>


<!-- =========================================
     JAVASCRIPT
========================================= -->

<script
    type="module"
    src="assets/js/orders.js"
></script>


</body>

</html>
