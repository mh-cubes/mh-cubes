
<!DOCTYPE html>
<html>

<head>

    <title>Settings - MH CUBES</title>

    <link rel="stylesheet" href="assets/css/style.css">

</head>


<body>

<!-- ========================================= -->
<!-- PAGE LOADING SCREEN -->
<!-- ========================================= -->

<div id="page-loading">

    <div class="loading-content">

        <div class="loading-logo">
            🧩
        </div>

        <div class="page-loader"></div>

        <h2>
            MH CUBES
        </h2>

        <p>
            Loading...
        </p>

    </div>

</div>


<!-- ========================================= -->
<!-- HEADER -->
<!-- ========================================= -->

<header>

    <div class="logo">
        MH CUBES
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="products.html">
            Products
        </a>

        <a href="cart.html">
            🛒 Cart
        </a>

        <a href="my-orders.html">
            📦 My Orders
        </a>

    </nav>

</header>


<!-- ========================================= -->
<!-- SETTINGS PAGE -->
<!-- ========================================= -->

<section class="settings-page">

    <h1>
        ⚙️ Settings
    </h1>


    <!-- ACCOUNT SETTINGS -->

    <div class="settings-box">

        <h2>
            Account Settings
        </h2>

        <p>
            Manage your MH CUBES account.
        </p>


        <button onclick="openAccount()">
            👤 Open Account
        </button>


        <div
            id="account-panel"
            style="display:none; margin-top:20px;"
        >

            <input
                id="username"
                placeholder="Your Name"
            >

            <br><br>


            <input
                id="email"
                placeholder="Your Email"
            >

            <br><br>


            <button onclick="saveAccount()">
                Save Account
            </button>

        </div>

    </div>


    <!-- NOTIFICATIONS -->

    <div class="settings-box">

        <h2>
            Notifications
        </h2>

        <p>
            Order updates and alerts.
        </p>

    </div>


    <!-- THEME -->

    <div class="settings-box">

        <h2>
            Theme
        </h2>

        <button
            id="darkModeBtn"
            onclick="toggleDarkMode()"
        >
            🌙 Dark Mode
        </button>

    </div>


</section>


<!-- ========================================= -->
<!-- ACCOUNT FUNCTIONS -->
<!-- ========================================= -->

<script>

function openAccount() {

    const panel =
        document.getElementById("account-panel");

    if (!panel) return;


    panel.style.display = "block";


    document.getElementById("username").value =
        localStorage.getItem("username") || "";


    document.getElementById("email").value =
        localStorage.getItem("email") || "";

}


function saveAccount() {

    localStorage.setItem(
        "username",
        document.getElementById("username").value
    );


    localStorage.setItem(
        "email",
        document.getElementById("email").value
    );


    alert(
        "Account saved successfully ✅"
    );

}

</script>


<!-- ========================================= -->
<!-- JAVASCRIPT -->
<!-- ========================================= -->

<script
    type="module"
    src="assets/js/app.js"
></script>


<script
    src="assets/js/page-loading.js"
></script>


</body>

</html>
