>

<link
    rel="stylesheet"
    href="assets/css/style.css"
>


</head>

<body>

<!-- =========================================
     PAGE LOADING SCREEN
========================================= -->

<div id="page-loading">

<div class="loading-content">

    <div class="loading-logo">
        🧩
    </div>

    <div class="page-loader"></div>

    <h2>
        SETTINGS
    </h2>

    <p>
        Opening settings...
    </p>

</div>


</div>

<!-- =========================================
     HEADER
========================================= -->

<header>


<div class="logo">
    MH CUBES
</div>


<nav>

    <a href="index.html">
        🏠 Home
    </a>

    <a href="products.html">
        🧩 Products
    </a>

    <a href="cart.html">
        🛒 Cart
    </a>

    <a href="my-orders.html">
        📦 My Orders
    </a>

</nav>


</header>

<!-- =========================================
     SETTINGS PAGE
========================================= -->

<section class="settings-page">


<h1>
    ⚙️ Settings
</h1>


<!-- =====================================
     ACCOUNT SETTINGS
====================================== -->

<div class="settings-box">

    <h2>
        Account Settings
    </h2>

    <p>
        Manage your MH CUBES account.
    </p>


    <button
        type="button"
        onclick="openAccount()"
    >
        👤 Open Account
    </button>


    <div
        id="account-panel"
        style="display:none; margin-top:20px;"
    >

        <input
            id="username"
            placeholder="Your Name"
        >

        <br><br>


        <input
            id="email"
            placeholder="Your Email"
        >

        <br><br>


        <button
            type="button"
            onclick="saveAccount()"
        >
            Save Account
        </button>

    </div>

</div>


<!-- =====================================
     NOTIFICATIONS
====================================== -->

<div class="settings-box">

    <h2>
        Notifications
    </h2>

    <p>
        Order updates and alerts.
    </p>

</div>


<!-- =====================================
     THEME
====================================== -->

<div class="settings-box">

    <h2>
        Theme
    </h2>


    <button
        id="darkModeBtn"
        type="button"
        onclick="toggleDarkMode()"
    >
        🌙 Dark Mode
    </button>

</div>


</section>

<!-- =========================================
     ACCOUNT FUNCTIONS
========================================= -->

<script>

function openAccount() {

    const panel =
        document.getElementById("account-panel");


    if (!panel) return;


    panel.style.display =
        "block";


    const username =
        document.getElementById("username");


    const email =
        document.getElementById("email");


    if (username) {

        username.value =
            localStorage.getItem("username") || "";

    }


    if (email) {

        email.value =
            localStorage.getItem("email") || "";

    }

}


function saveAccount() {

    const username =
        document.getElementById("username");


    const email =
        document.getElementById("email");


    localStorage.setItem(
        "username",
        username.value
    );


    localStorage.setItem(
        "email",
        email.value
    );


    alert(
        "Account saved successfully ✅"
    );

}

</script>

<!-- =========================================
     APP.JS
========================================= -->

<script
    type="module"
    src="assets/js/app.js"
></script>

<!-- =========================================
     PAGE LOADING SYSTEM
========================================= -->

<script
    src="assets/js/page-loading.js"
></script>
