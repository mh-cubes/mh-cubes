<!DOCTYPE html>
<html>

<head>

<title>MH CUBES Owner Login</title>

<link rel="stylesheet" href="assets/css/style.css">

<style>

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#111827,#2563eb);
    font-family:Arial, sans-serif;
}


.login-box{

    background:white;
    width:350px;
    padding:35px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
    text-align:center;

}


.login-box h1{

    margin-bottom:10px;
    color:#2563eb;

}


.login-box p{

    color:#666;
    margin-bottom:25px;

}


.login-box input{

    width:90%;
    padding:14px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;

}


.login-box button{

    width:95%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:17px;
    cursor:pointer;

}


.login-box button:hover{

    background:#1d4ed8;

}


#login-error{

    color:red;
    margin-top:15px;

}


.logo{

    font-size:45px;

}

</style>

</head>


<body>


<div class="login-box">

<div class="logo">
🔐
</div>


<h1>MH CUBES</h1>

<p>Owner Dashboard Login</p>


<input id="owner-email" type="email" placeholder="huzaifa81102@email.com">

<input id="owner-password" type="password" placeholder="SamsungS26Ultra">


<button id="login-button">
Login
</button>


<p id="login-error"></p>


</div>


<script type="module" src="assets/js/owner-login.js"></script>


</body>

</html>
