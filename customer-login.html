
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Login - MH CUBES</title>

<link rel="stylesheet" href="assets/css/style.css">

<style>

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#111827,#2563eb);
    font-family:Arial,sans-serif;
}

.login-box{
    background:white;
    width:350px;
    padding:35px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
    text-align:center;
}

.login-box h1{
    color:#2563eb;
    margin-bottom:10px;
}

.login-box p{
    color:#666;
}

.login-box input{
    width:90%;
    padding:14px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

.login-box button{
    width:95%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.login-box button:hover{
    background:#1d4ed8;
}

#login-message{
    margin-top:15px;
}

</style>

</head>

<body>

<div class="login-box">

    <div style="font-size:45px;">
        👤
    </div>

    <h1>MH CUBES</h1>

    <p>Customer Account</p>

    <input
        type="email"
        id="customer-email"
        placeholder="Enter your email"
    >

    <input
        type="password"
        id="customer-password"
        placeholder="Enter your password"
    >

    <button id="login-button">
        Login
    </button>

    <button id="signup-button">
        Create Account
    </button>

    <p id="login-message"></p>

</div>


<script type="module">

import { auth } from "./assets/js/firebase.js";

import {
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    setPersistence,
    browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


const emailInput =
    document.getElementById("customer-email");

const passwordInput =
    document.getElementById("customer-password");

const message =
    document.getElementById("login-message");
// Keep customer signed in
setPersistence(auth, browserLocalPersistence)
    .catch((error) => {
        console.error("Persistence error:", error);
    });

// =============================
// LOGIN
// =============================

document
.getElementById("login-button")
.addEventListener("click", async function(){

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    if(!email || !password){

        message.innerText =
            "❌ Please enter your email and password.";

        message.style.color = "red";

        return;

    }


  try{

    await setPersistence(auth, browserLocalPersistence);

    await signInWithEmailAndPassword(
        auth,
        email,
        password
    );


        message.innerText =
            "✅ Login successful!";

        message.style.color =
            "green";


        setTimeout(function(){

           window.location.href = "my-orders.html";

        },1000);


    }catch(error){

        console.error(error);

        message.innerText =
            "❌ Invalid email or password.";

        message.style.color =
            "red";

    }

});


// =============================
// CREATE ACCOUNT
// =============================

document
.getElementById("signup-button")
.addEventListener("click", async function(){

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    if(!email || !password){

        message.innerText =
            "❌ Please enter an email and password.";

        message.style.color =
            "red";

        return;

    }


    if(password.length < 6){

        message.innerText =
            "❌ Password must be at least 6 characters.";

        message.style.color =
            "red";

        return;

    }


   try{

    await setPersistence(auth, browserLocalPersistence);

    await createUserWithEmailAndPassword(
        auth,
        email,
        password
    );


        message.innerText =
            "✅ Account created successfully!";

        message.style.color =
            "green";


        setTimeout(function(){

            window.location.href = "my-orders.html";
        },1000);


    }catch(error){

        console.error(error);


        if(error.code === "auth/email-already-in-use"){

            message.innerText =
                "❌ This email already has an account.";

        }else{

            message.innerText =
                "❌ Could not create account.";

        }

        message.style.color =
            "red";

    }

});

</script>

</body>

</html>
