<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Track Order - MH CUBES</title>

<link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

<header>

    <div class="logo">
        MH CUBES
    </div>

    <nav>

        <a href="index.html">
            🏠 Home
        </a>

        <a href="cart.html">
            🛒 Cart
        </a>

    </nav>

</header>
<div class="checkout">

    <h1>
        📦 Track Your Order
    </h1>

    <div class="checkout-box">

        <h2>
            Enter Your Order ID
        </h2>

        <p>
            Enter the Order ID you received after placing your order.
        </p>

        <input
            type="text"
            id="track-id"
            placeholder="Example: MH1754652345678"
            autocomplete="off"
        >

        <button
            class="place-order"
            id="track-button"
        >
            🔍 Track Order
        </button>

        <div id="track-result">

        </div>

    </div>

</div>
<script type="module">

import { db } from "./assets/js/firebase.js";

import {
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const trackInput =
    document.getElementById("track-id");

const trackButton =
    document.getElementById("track-button");

const result =
    document.getElementById("track-result");


async function trackOrder(){

    const id =
        trackInput.value.trim();


    if(id === ""){

        result.innerHTML =
            "<h3 style='color:red;'>❌ Please enter your Order ID.</h3>";

        return;

    }


    result.innerHTML =
        "<h3>🔍 Searching for your order...</h3>";


    try{

        const snapshot =
            await getDocs(
                collection(db, "orders")
            );


        let found = null;


        snapshot.forEach(function(docSnap){

            const order =
                docSnap.data();


            if(order.orderID === id){

                found = order;

            }

        });


        if(found){

            result.innerHTML = `

                <div class="admin-order-box">

                    <h2>
                        📦 Order Found
                    </h2>

                    <p>
                        <strong>Order ID:</strong>
                        ${found.orderID}
                    </p>

                    <p>
                        <strong>Customer:</strong>
                        ${found.customerName || "Not available"}
                    </p>

                    <p>
                        <strong>Phone:</strong>
                        ${found.phone || "Not available"}
                    </p>

                    <p>
                        <strong>Payment:</strong>
                        ${found.payment || "Not selected"}
                    </p>

                    <p>
                        <strong>Status:</strong>
                        ${found.status || "Pending 🟡"}
                    </p>

                    <p>
                        <strong>Date:</strong>
                        ${found.date || "Not available"}
                    </p>

                    <p>
                        <strong>Address:</strong>
                        ${found.address || "Not available"}
                    </p>

                    <h3>
                        🚚 Current Order Status
                    </h3>

                    <div style="
                        padding:15px;
                        margin-top:10px;
                        border-radius:10px;
                        text-align:center;
                        font-weight:bold;
                        font-size:18px;
                    ">

                        ${found.status || "Pending 🟡"}

                    </div>

                </div>

            `;

        }else{

            result.innerHTML = `

                <div style="
                    text-align:center;
                    padding:20px;
                ">

                    <h3 style="color:red;">
                        ❌ Order Not Found
                    </h3>

                    <p>
                        No order was found with this Order ID.
                    </p>

                    <p>
                        Please check your Order ID and try again.
                    </p>

                </div>

            `;

        }


    }catch(error){

        console.error(
            "Tracking error:",
            error
        );


        result.innerHTML = `

            <div style="
                text-align:center;
                padding:20px;
            ">

                <h3 style="color:red;">
                    ❌ Unable to check order
                </h3>

                <p>
                    Please try again.
                </p>

            </div>

        `;

    }

}


trackButton.addEventListener(
    "click",
    trackOrder
);


trackInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            trackOrder();

        }

    }
);

</script>

</body>

</html>
