<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Track Order - MH CUBES</title>

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >

    <style>

        .track-message {
            margin-top: 20px;
            padding: 20px;
            border-radius: 14px;
            background: #f5f5f5;
            text-align: center;
        }

        .track-message h3 {
            margin-top: 0;
            color: #2563eb;
        }

        .track-message.error h3 {
            color: #dc2626;
        }

        .track-message p {
            color: #555;
            line-height: 1.6;
        }

        .track-login-btn {
            display: inline-block;
            margin-top: 12px;
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 700;
        }

        .track-products {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }

        .track-product {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 12px;
        }

        .track-product-image {
            width: 60px;
            height: 60px;
            object-fit: contain;
            background: white;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .track-product-info {
            min-width: 0;
        }

        .track-product-info h4 {
            margin: 0 0 7px;
            color: #2563eb;
        }

        .track-product-info p {
            margin: 3px 0;
            color: #555;
            font-size: 14px;
        }

        .track-subtotal {
            font-weight: 700;
        }

        .track-muted {
            color: #777;
            text-align: center;
        }

        .track-status {
            margin-top: 12px;
            padding: 15px;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            text-align: center;
            font-size: 18px;
            font-weight: 800;
        }

        .track-cancelled {
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            margin-top: 15px;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-weight: 700;
        }

        @media (max-width: 600px) {

            .track-product {
                gap: 10px;
                padding: 9px;
            }

            .track-product-image {
                width: 48px;
                height: 48px;
            }

            .track-product-info h4 {
                font-size: 14px;
            }

            .track-product-info p {
                font-size: 12px;
            }

            .track-status {
                font-size: 15px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        MH CUBES
    </div>

    <nav>

        <a href="index.html">
            🏠 Home
        </a>

        <a href="cart.html">
            🛒 Cart
        </a>

    </nav>

</header>


<main class="checkout">

    <h1>
        📦 Track Your Order
    </h1>


    <div class="checkout-box">

        <h2>
            Enter Your Order ID
        </h2>

        <p>
            Enter the Order ID you received after placing your order.
        </p>


        <input
            type="text"
            id="track-id"
            placeholder="Example: MH1754652345678"
            autocomplete="off"
        >


        <button
            class="place-order"
            id="track-button"
            type="button"
        >
            🔍 Track Order
        </button>


        <div id="track-result"></div>

    </div>

</main>


<script type="module">

import { db, auth } from "./assets/js/firebase.js";

import {
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


const trackInput =
    document.getElementById("track-id");

const trackButton =
    document.getElementById("track-button");

const result =
    document.getElementById("track-result");


let currentUser = null;


const urlParams =
    new URLSearchParams(
        window.location.search
    );


const orderIDFromURL =
    urlParams.get("orderID");


if (orderIDFromURL) {

    trackInput.value =
        orderIDFromURL.trim();

}


/* =========================================
   TRACK ORDER
========================================= */

async function trackOrder() {

    const id =
        trackInput.value.trim();


    if (!id) {

        result.innerHTML = `

            <div class="track-message error">

                <h3>
                    ❌ Please enter your Order ID.
                </h3>

            </div>

        `;

        return;

    }


    if (!currentUser) {

        result.innerHTML = `

            <div class="track-message error">

                <h3>
                    🔒 Please sign in first.
                </h3>

            </div>

        `;

        return;

    }


    result.innerHTML = `

        <div class="track-message">

            <h3>
                🔍 Searching for your order...
            </h3>

        </div>

    `;


    try {

        const ordersRef =
            collection(
                db,
                "orders"
            );


        const ordersQuery =
            query(

                ordersRef,

                where(
                    "customerUID",
                    "==",
                    currentUser.uid
                ),

                where(
                    "orderID",
                    "==",
                    id
                )

            );


        const snapshot =
            await getDocs(
                ordersQuery
            );


        if (snapshot.empty) {

            result.innerHTML = `

                <div class="track-message error">

                    <h3>
                        ❌ Order Not Found
                    </h3>

                    <p>
                        No order was found with this Order ID
                        on your account.
                    </p>

                    <p>
                        Please check your Order ID and try again.
                    </p>

                </div>

            `;

            return;

        }


        const docSnap =
            snapshot.docs[0];

        const order =
            docSnap.data();


        /* =================================
           PRODUCTS
        ================================= */

        let productsHTML = "";


        if (
            order.products &&
            typeof order.products === "object"
        ) {

            Object.keys(
                order.products
            ).forEach(function(productName) {

                const product =
                    order.products[productName];


                const price =
                    Number(product.price) || 0;


                const quantity =
                    Number(product.quantity) || 0;


                const subtotal =
                    price * quantity;


                const image =
                    product.image ||
                    product.img ||
                    "";


                productsHTML += `

                    <div class="track-product">

                        ${
                            image
                            ?
                            `
                                <img
                                    src="${image}"
                                    alt="${productName}"
                                    class="track-product-image"
                                    onerror="this.style.display='none';"
                                >
                            `
                            :
                            ""
                        }


                        <div class="track-product-info">

                            <h4>
                                🧩 ${productName}
                            </h4>

                            <p>
                                💰 Price:
                                PKR ${price.toLocaleString()}
                            </p>

                            <p>
                                🔢 Quantity:
                                ${quantity}
                            </p>

                            <p class="track-subtotal">
                                💵 Subtotal:
                                PKR ${subtotal.toLocaleString()}
                            </p>

                        </div>

                    </div>

                `;

            });

        }


        if (!productsHTML) {

            productsHTML = `

                <p class="track-muted">
                    No product information available.
                </p>

            `;

        }


        /* =================================
           STATUS
        ================================= */

        const status =
            order.status ||
            "Pending";


        const statusLower =
            status.toLowerCase();


        /* =================================
           CANCELLED MESSAGE
        ================================= */

        let cancelledMessage = "";


        if (
            statusLower === "cancelled" ||
            statusLower === "canceled"
        ) {

            cancelledMessage = `

                <div class="track-cancelled">

                    ❌ This order has been cancelled.

                    <br><br>

                    This order was cancelled by the customer.

                </div>

            `;

        }


        /* =================================
           TOTAL
        ================================= */

        const total =
            Number(order.total) || 0;


        /* =================================
           DISPLAY ORDER
        ================================= */

        result.innerHTML = `

            <div class="admin-order-box">

                <h2>
                    📦 Order Found
                </h2>


                <p>
                    <strong>Order ID:</strong>
                    ${order.orderID || id}
                </p>


                <p>
                    <strong>Customer:</strong>
                    ${order.customerName || "Not available"}
                </p>


                <p>
                    <strong>Phone:</strong>
                    ${order.phone || "Not available"}
                </p>


                <p>
                    <strong>Payment:</strong>
                    ${order.payment || "Not selected"}
                </p>


                <p>
                    <strong>Status:</strong>
                    ${status}
                </p>


                <p>
                    <strong>Date:</strong>
                    ${order.date || "Not available"}
                </p>


                <p>
                    <strong>Address:</strong>
                    ${order.address || "Not available"}
                </p>


                <h3>
                    🧩 Products Ordered
                </h3>


                <div class="track-products">

                    ${productsHTML}

                </div>


                <h3>
                    🚚 Current Order Status
                </h3>


                <div
                    class="track-status"
                    ${
                        statusLower === "cancelled" ||
                        statusLower === "canceled"
                        ?
                        'style="background:#dc2626;"'
                        :
                        ""
                    }
                >

                    ${status}

                </div>


                ${cancelledMessage}

            </div>

        `;

    }


    catch (error) {

        console.error(
            "Tracking error:",
            error
        );


        result.innerHTML = `

            <div class="track-message error">

                <h3>
                    ❌ Unable to check order
                </h3>

                <p>
                    Something went wrong while
                    checking your order.
                </p>

                <p>
                    Please try again.
                </p>

            </div>

        `;

    }

}


/* =========================================
   AUTH STATE
========================================= */

onAuthStateChanged(

    auth,

    function(user) {

        if (!user) {

            currentUser = null;

            trackButton.disabled = true;


            result.innerHTML = `

                <div class="track-message error">

                    <h3>
                        🔒 Please Sign In
                    </h3>

                    <p>
                        You must be logged in to track your order.
                    </p>


                    <a
                        href="customer-login.html"
                        class="track-login-btn"
                    >
                        👤 Sign In
                    </a>

                </div>

            `;

            return;

        }


        currentUser = user;

        trackButton.disabled = false;


        if (orderIDFromURL) {

            trackOrder();

        }

    }

);


/* =========================================
   TRACK BUTTON
========================================= */

trackButton.addEventListener(
    "click",
    trackOrder
);


/* =========================================
   ENTER KEY
========================================= */

trackInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            trackOrder();

        }

    }
);

</script>


</body>

</html>
