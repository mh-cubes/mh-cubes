<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Track Order - MH CUBES</title>

<link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

<header>

    <div class="logo">
        MH CUBES
    </div>

    <nav>

        <a href="index.html">
            🏠 Home
        </a>

        <a href="cart.html">
            🛒 Cart
        </a>

    </nav>

</header>
<div class="checkout">

    <h1>
        📦 Track Your Order
    </h1>

    <div class="checkout-box">

        <h2>
            Enter Your Order ID
        </h2>

        <p>
            Enter the Order ID you received after placing your order.
        </p>

        <input
            type="text"
            id="track-id"
            placeholder="Example: MH1754652345678"
            autocomplete="off"
        >

        <button
            class="place-order"
            id="track-button"
        >
            🔍 Track Order
        </button>

        <div id="track-result">

        </div>

    </div>

</div>
<script type="module">

import { db, auth } from "./assets/js/firebase.js";

import {
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


const trackInput =
    document.getElementById("track-id");

const trackButton =
    document.getElementById("track-button");

const result =
    document.getElementById("track-result");
const urlParams =
    new URLSearchParams(window.location.search);

const orderIDFromURL =
    urlParams.get("orderID");

if(orderIDFromURL){

    trackInput.value =
        orderIDFromURL;

}

// =============================
// CHECK LOGIN
// =============================

let currentUser = null;


onAuthStateChanged(
    auth,
    function(user){

        if(!user){

            currentUser = null;

            result.innerHTML = `

                <div style="
                    text-align:center;
                    padding:20px;
                ">

                    <h3 style="color:red;">
                        🔒 Please Sign In
                    </h3>

                    <p>
                        You must be logged in to track your order.
                    </p>

                    <a
                        href="customer-login.html"
                        style="
                            display:inline-block;
                            margin-top:10px;
                            padding:12px 20px;
                            background:#2563eb;
                            color:white;
                            border-radius:8px;
                            text-decoration:none;
                        "
                    >
                        👤 Sign In
                    </a>

                </div>

            `;

            trackButton.disabled = true;

            return;

        }


       currentUser = user;

trackButton.disabled = false;

// Automatically track order if Order ID came from My Orders
if (orderIDFromURL) {
    trackOrder();
}

    }
);


// =============================
// TRACK ORDER
// =============================

async function trackOrder(){

    const id =
        trackInput.value.trim();


    if(id === ""){

        result.innerHTML =
            "<h3 style='color:red;'>❌ Please enter your Order ID.</h3>";

        return;

    }


    if(!currentUser){

        result.innerHTML = `

            <h3 style="color:red;">
                🔒 Please sign in first.
            </h3>

        `;

        return;

    }


    result.innerHTML =
        "<h3>🔍 Searching for your order...</h3>";


    try{

        // =============================
        // SEARCH ONLY CUSTOMER'S ORDERS
        // =============================

        const ordersRef =
            collection(db, "orders");


        const q =
            query(
                ordersRef,

                where(
                    "customerUID",
                    "==",
                    currentUser.uid
                ),

                where(
                    "orderID",
                    "==",
                    id
                )
            );


        const snapshot =
            await getDocs(q);


       if(!snapshot.empty){

    const docSnap =
        snapshot.docs[0];

    const found =
        docSnap.data();


    // =============================
    // PRODUCTS
    // =============================

    let productsHTML = "";

    if(found.products){

        productsHTML = Object.keys(found.products)
            .map(function(productName){

                const product =
                    found.products[productName];

                return `

                    <div style="
                        background:#f8fafc;
                        padding:15px;
                        margin:10px 0;
                        border-radius:10px;
                        border:1px solid #e5e7eb;
                    ">

                        <p style="
                            margin:0 0 8px;
                            font-size:17px;
                        ">

                            <strong>
                                🧩 ${productName}
                            </strong>

                        </p>

                        <p style="margin:5px 0;">

                            💰 Price:
                            PKR ${product.price}

                        </p>

                        <p style="margin:5px 0;">

                            🔢 Quantity:
                            ${product.quantity}

                        </p>

                        <p style="
                            margin:5px 0;
                            font-weight:bold;
                        ">

                            💵 Subtotal:
                            PKR ${
                                Number(product.price) *
                                Number(product.quantity)
                            }

                        </p>

                    </div>

                `;

            })
            .join("");

    }else{

        productsHTML = `

            <p>
                No product information available.
            </p>

        `;

    }


    // =============================
    // SHOW ORDER
    // =============================

    result.innerHTML = `

        <div class="admin-order-box">

            <h2>
                📦 Order Found
            </h2>


            <p>
                <strong>Order ID:</strong>
                ${found.orderID || "Not available"}
            </p>


            <p>
                <strong>Customer:</strong>
                ${found.customerName || "Not available"}
            </p>


            <p>
                <strong>Phone:</strong>
                ${found.phone || "Not available"}
            </p>


            <p>
                <strong>Payment:</strong>
                ${found.payment || "Not selected"}
            </p>


            <p>
                <strong>Status:</strong>
                ${found.status || "Pending 🟡"}
            </p>


            <p>
                <strong>Date:</strong>
                ${found.date || "Not available"}
            </p>


            <p>
                <strong>Address:</strong>
                ${found.address || "Not available"}
            </p>


            <!-- ============================= -->
            <!-- PRODUCTS -->
            <!-- ============================= -->

            <h3>
                🧩 Products Ordered
            </h3>


            <div>

                ${productsHTML}

            </div>


            <!-- ============================= -->
            <!-- ORDER STATUS -->
            <!-- ============================= -->

            <h3>
                🚚 Current Order Status
            </h3>


            <div style="
                padding:15px;
                margin-top:10px;
                border-radius:10px;
                text-align:center;
                font-weight:bold;
                font-size:18px;
            ">

                ${found.status || "Pending 🟡"}

            </div>

        </div>

    `;

}

        }else{

            result.innerHTML = `

                <div style="
                    text-align:center;
                    padding:20px;
                ">

                    <h3 style="color:red;">
                        ❌ Order Not Found
                    </h3>

                    <p>
                        No order was found with this Order ID
                        on your account.
                    </p>

                    <p>
                        Please check your Order ID and try again.
                    </p>

                </div>

            `;

        }


    }catch(error){

        console.error(
            "Tracking error:",
            error
        );


        result.innerHTML = `

            <div style="
                text-align:center;
                padding:20px;
            ">

                <h3 style="color:red;">
                    ❌ Unable to check order
                </h3>

                <p>
                    Please try again.
                </p>

            </div>

        `;

    }

}


// =============================
// TRACK BUTTON
// =============================

trackButton.addEventListener(
    "click",
    trackOrder
);


// =============================
// ENTER KEY
// =============================

trackInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            trackOrder();

        }

    }
);

</script>

</body>

</html>
